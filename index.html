<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Bookshelf</title>
<meta name="description" content="A cosy visual shelf of the books I own.">
<meta name="theme-color" content="#6e4527" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bookshelf">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f6efe3;
  --paper-2: #efe4d2;
  --card: #fffaf1;
  --ink: #2b2118;
  --muted: #7a6a58;
  --line: #e2d4bf;
  --accent: #9c4a2f;
  --accent-ink: #fffaf1;
  --wood-1: #9a6a43;
  --wood-2: #7a4f2e;
  --wood-3: #5c3a20;
  --back: #e7d7bf;
  --read: #4f7a4a;
  --reading: #c08a2e;
  --kindle: #2f4f6e;
  --shadow: 0 1px 2px rgba(60,40,20,.12), 0 6px 18px rgba(60,40,20,.10);
  --radius: 14px;
  --serif: "Fraunces", Georgia, "Times New Roman", serif;
  --sans: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1b1512; --paper-2: #221a15; --card: #2a201a; --ink: #f1e6d6; --muted: #b3a28c;
    --line: #3d2f25; --accent: #e09a6b; --accent-ink: #1b1512;
    --wood-1: #6b4529; --wood-2: #4e311c; --wood-3: #362112; --back: #241a14;
    --read: #8fbf86; --reading: #e8b65a; --kindle: #8fb4d9;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1b1512; --paper-2: #221a15; --card: #2a201a; --ink: #f1e6d6; --muted: #b3a28c;
  --line: #3d2f25; --accent: #e09a6b; --accent-ink: #1b1512;
  --wood-1: #6b4529; --wood-2: #4e311c; --wood-3: #362112; --back: #241a14;
  --read: #8fbf86; --reading: #e8b65a; --kindle: #8fb4d9;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans);
  font-size: 16px; line-height: 1.45; min-height: 100vh;
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
.hidden { display: none !important; }

/* ── Header ── */
.top {
  position: sticky; top: 0; z-index: 20; background: var(--paper);
  padding: calc(10px + env(safe-area-inset-top)) 16px 8px;
  border-bottom: 1px solid var(--line);
}
.top-row { display: flex; align-items: center; gap: 8px; max-width: 1100px; margin: 0 auto; }
.brand { flex: 1; min-width: 0; }
.brand h1 { font-family: var(--serif); font-weight: 700; font-size: 1.55rem; margin: 0; letter-spacing: -.01em; line-height: 1.1; }
.brand .stats { color: var(--muted); font-size: .82rem; }
.icon-btn {
  border: 1px solid var(--line); background: var(--card); border-radius: 999px;
  height: 40px; min-width: 40px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-weight: 700; font-size: .85rem;
}
.icon-btn svg { width: 18px; height: 18px; }
.tbr-btn { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

.tabs { display: flex; gap: 4px; background: var(--paper-2); border-radius: 999px; padding: 4px; max-width: 1100px; margin: 10px auto 0; }
.tabs button { flex: 1; border: 0; background: none; border-radius: 999px; padding: 7px 0; font-weight: 700; font-size: .9rem; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

.filters { max-width: 1100px; margin: 8px auto 0; }
.search { position: relative; }
.search input {
  width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 999px;
  padding: 9px 14px 9px 38px; outline: none;
}
.search input:focus { border-color: var(--accent); }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--muted); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips select {
  appearance: none; -webkit-appearance: none; border: 1px solid var(--line); background: var(--card);
  border-radius: 999px; padding: 6px 26px 6px 12px; font-size: .84rem; font-weight: 600; flex: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 14px) 52%, calc(100% - 9px) 52%; background-size: 5px 5px; background-repeat: no-repeat;
}
.chips select.on { border-color: var(--accent); color: var(--accent); }
/* series stacks (Kindle-style) */
.stack { position: relative; padding: 12% 12% 0 0; }
.stack-front { position: relative; z-index: 3; }
.stack-back { position: absolute; top: 0; width: 88%; z-index: 1; filter: brightness(.78); }
.stack-back.l1 { left: 6%; top: 6%; z-index: 2; filter: brightness(.9); }
.stack-back.l2 { left: 12%; top: 0; }
.stack-back .cover, .stack-front .cover { width: 100%; }
.stack-count {
  position: absolute; z-index: 4; right: 2px; bottom: 4px; min-width: 22px; height: 22px; padding: 0 6px;
  border-radius: 999px; background: var(--ink); color: var(--paper); font-weight: 800; font-size: 12px;
  display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.35);
}
.row .stack-count { min-width: 18px; height: 18px; font-size: 10px; right: 0; bottom: 0; }
.row .chev { font-size: 1.6rem; color: var(--muted); padding: 0 4px; }
button.missing { width: 100%; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: var(--serif); }
button.missing small { font-family: var(--sans); font-size: .68rem; font-weight: 700; color: var(--accent); }
button.missing:hover, button.missing:focus-visible { border-color: var(--accent); }
button.missing.add-more { font-size: 1.6rem; color: var(--accent); }
.folder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 14px 12px; margin-top: 8px; }
.folder-grid .sslot { width: auto; }
.folder-grid .ft { font-size: .76rem; line-height: 1.2; margin-top: 2px; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.chip-toggle { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: .84rem; font-weight: 600; }
.chip-toggle::before { content: "○ "; }
.chip-toggle[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.chip-toggle[aria-pressed="true"]::before { content: "● "; }
.list-group-h { grid-column: 1 / -1; font-family: var(--serif); font-weight: 600; font-size: 1.02rem; margin: 8px 2px -2px; }
.list-group-h span { font-family: var(--sans); font-weight: 400; font-size: .82rem; color: var(--muted); }

main { max-width: 1100px; margin: 0 auto; padding: 16px; }
.empty { text-align: center; color: var(--muted); padding: 48px 16px; }
.empty h2 { font-family: var(--serif); color: var(--ink); font-weight: 600; margin: 0 0 6px; }

.banner {
  max-width: 1068px; margin: 12px 16px 0; background: var(--card); border: 1px dashed var(--line);
  border-radius: var(--radius); padding: 10px 14px; font-size: .86rem; color: var(--muted);
}

/* ── Covers ── */
.cover {
  --h: 20; position: relative; aspect-ratio: 2 / 3; border-radius: 2px 4px 4px 2px; overflow: hidden;
  background: hsl(var(--h) 35% 38%); box-shadow: 0 1px 1px rgba(0,0,0,.2), 0 4px 10px rgba(0,0,0,.25);
}
.cover::before { /* spine crease */
  content: ""; position: absolute; inset: 0 auto 0 0; width: 6%; z-index: 2;
  background: linear-gradient(90deg, rgba(0,0,0,.18), rgba(255,255,255,.12) 60%, transparent);
}
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
.cover .fb {
  position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between;
  padding: 12% 10%; color: hsl(var(--h) 40% 92%); text-align: center;
  background: linear-gradient(160deg, hsl(var(--h) 40% 42%), hsl(var(--h) 45% 26%));
}
.cover .fb-t { font-family: var(--serif); font-weight: 700; font-size: clamp(.55rem, 2.6cqw + .3rem, 1.2rem); line-height: 1.1; overflow: hidden; }
.cover .fb-a { font-size: clamp(.45rem, 1.6cqw + .25rem, .85rem); opacity: .85; }
.cover { container-type: inline-size; }
.badge {
  position: absolute; z-index: 3; display: grid; place-items: center; font-weight: 800; color: #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.35);
}
.badge.read { top: 4px; right: 4px; width: 18px; height: 18px; border-radius: 50%; background: var(--read); font-size: 11px; }
.badge.reading {
  top: -2px; right: 8px; width: 12px; height: 24px; background: var(--reading);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%); box-shadow: none;
}
.badge.kindle { left: 7%; bottom: 4px; padding: 1px 5px; border-radius: 4px; background: var(--kindle); font-size: 9px; letter-spacing: .04em; }
:root .badge.kindle { color: #fff; }
.badge svg { width: 11px; height: 11px; }

/* ── Shelf view ── */
.bookcase {
  --w: 68px; --plank: 14px; --gap-top: 16px; --row: calc(var(--w) * 1.5 + var(--gap-top) + var(--plank));
  position: relative; padding: 0 12px; border-radius: 6px;
  border: 10px solid var(--wood-2); border-top-width: 16px; border-bottom-width: 0;
  background-color: var(--back);
  background-image:
    repeating-linear-gradient(to bottom,
      transparent 0, transparent calc(var(--row) - var(--plank) - 10px),
      rgba(0,0,0,.10) calc(var(--row) - var(--plank)),
      var(--wood-1) calc(var(--row) - var(--plank)), var(--wood-2) calc(var(--row) - 3px), var(--wood-3) var(--row)),
    radial-gradient(ellipse at 50% 0%, rgba(255,220,160,.25), transparent 70%);
  box-shadow: inset 0 8px 14px rgba(0,0,0,.18), var(--shadow);
  display: grid; grid-template-columns: repeat(auto-fill, var(--w)); grid-auto-rows: var(--row);
  column-gap: 8px; justify-content: space-evenly;
}
.bookcase::after { /* plinth */
  content: ""; position: absolute; left: -10px; right: -10px; bottom: -14px; height: 14px;
  background: var(--wood-3); border-radius: 0 0 6px 6px;
}
.slot { display: flex; align-items: flex-end; justify-content: center; padding-bottom: var(--plank); }
.slot button { border: 0; padding: 0; background: none; width: 100%; display: block; transform-origin: bottom center; transition: transform .15s; }
.slot button:active { transform: translateY(-4px) scale(1.02); }
@media (hover: hover) { .slot button:hover { transform: translateY(-5px); } }
.slot .cover { width: 100%; }
.shelf-wrap { margin-bottom: 26px; }
@media (min-width: 640px) { .bookcase { --w: 92px; column-gap: 14px; } }
@media (min-width: 1000px) { .bookcase { --w: 104px; } }

/* ── List view ── */
.list { display: grid; gap: 10px; }
@media (min-width: 760px) { .list { grid-template-columns: 1fr 1fr; } }
.row {
  display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 10px; text-align: left; width: 100%;
}
.row .cover { width: 52px; flex: none; }
.row .meta { min-width: 0; flex: 1; }
.row .t { font-family: var(--serif); font-weight: 600; font-size: 1.02rem; line-height: 1.2; }
.row .a { color: var(--muted); font-size: .88rem; }
.row .s { color: var(--muted); font-size: .8rem; font-style: italic; }
.pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.pill { font-size: .72rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--paper-2); color: var(--muted); }
.pill.read { background: color-mix(in srgb, var(--read) 18%, transparent); color: var(--read); }
.pill.reading { background: color-mix(in srgb, var(--reading) 20%, transparent); color: var(--reading); }
.pill.kindle { background: color-mix(in srgb, var(--kindle) 18%, transparent); color: var(--kindle); }

/* ── Series view ── */
.series-card { overflow: hidden; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
.series-card h3 { font-family: var(--serif); font-weight: 600; margin: 0; font-size: 1.15rem; }
.series-card .sub { color: var(--muted); font-size: .84rem; margin-bottom: 10px; }
.progress { height: 5px; background: var(--paper-2); border-radius: 99px; overflow: hidden; margin: 6px 0 10px; }
.progress span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.series-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.sslot { flex: none; width: 64px; text-align: center; }
.sslot button { border: 0; padding: 0; background: none; width: 100%; }
.sslot .num { font-size: .72rem; font-weight: 700; color: var(--muted); margin-top: 4px; }
.missing {
  aspect-ratio: 2/3; border: 2px dashed var(--line); border-radius: 4px; display: grid; place-items: center;
  color: var(--muted); font-family: var(--serif); font-size: 1.1rem; background: var(--paper);
}

/* ── FAB ── */
.fab {
  position: fixed; right: 18px; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 30;
  height: 58px; padding: 0 22px 0 18px; border-radius: 999px; border: 0; background: var(--accent); color: var(--accent-ink);
  font-weight: 800; font-size: 1rem; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px rgba(100,40,20,.35);
}
.fab svg { width: 24px; height: 24px; }

/* ── Sheets (pop-up panels) ── */
.sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(20,12,6,.45); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s; }
.sheet {
  background: var(--paper); width: 100%; max-width: 640px; max-height: 94vh; overflow-y: auto; overscroll-behavior: contain;
  border-radius: 20px 20px 0 0; padding: 8px 16px calc(24px + env(safe-area-inset-bottom)); animation: up .22s ease-out;
}
@media (min-width: 700px) { .sheet-bg { align-items: center; } .sheet { border-radius: 20px; max-height: 90vh; } }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
@keyframes fade { from { opacity: 0; } }
.sheet-head { position: sticky; top: -8px; background: var(--paper); z-index: 5; display: flex; align-items: center; gap: 8px; padding: 10px 0 8px; }
.sheet-head h2 { flex: 1; margin: 0; font-family: var(--serif); font-weight: 600; font-size: 1.25rem; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 2px auto 0; }

.seg { display: flex; background: var(--paper-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 9px; padding: 8px 4px; font-weight: 700; font-size: .88rem; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.seg.status button.on[data-v="Read"] { color: var(--read); }
.seg.status button.on[data-v="Reading"] { color: var(--reading); }

.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 800; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); font-weight: 700; }
.btn.danger { background: none; color: #b3402a; border: 1px solid currentColor; font-weight: 700; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .55; }
.link-btn { border: 0; background: none; color: var(--accent); font-weight: 700; padding: 6px 0; text-decoration: underline; text-underline-offset: 3px; }

label.f { display: block; margin-top: 12px; font-size: .8rem; font-weight: 700; color: var(--muted); }
.f input, .f textarea, .f select, .inp {
  display: block; width: 100%; margin-top: 4px; border: 1px solid var(--line); background: var(--card);
  border-radius: 10px; padding: 10px 12px; font-size: 1rem; color: var(--ink); outline: none;
}
.f input:focus, .f textarea:focus, .inp:focus { border-color: var(--accent); }
.f textarea { min-height: 140px; resize: vertical; line-height: 1.45; }
.combo { position: relative; display: block; }
.combo input { padding-right: 40px !important; }
.combo-btn { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); margin-top: 2px; border: 0; background: none; width: 38px; height: 38px; font-size: 1rem; color: var(--muted); }
.pick-list { margin-top: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; max-height: 260px; overflow-y: auto; box-shadow: var(--shadow); }
.pick-list button { display: flex; flex-direction: column; align-items: flex-start; width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 10px 12px; text-align: left; }
.pick-list button:last-child { border-bottom: 0; }
.pick-list b { font-family: var(--serif); font-weight: 600; }
.pick-list span { font-size: .8rem; color: var(--muted); }
.pick-empty { padding: 10px 12px; color: var(--muted); font-size: .88rem; }
.gpick { gap: 6px; margin-top: 6px; }
.gpick .pill { border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: .84rem; padding: 6px 11px; font-weight: 600; }
.gpick .pill.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.gpick .pill.add { border-style: dashed; color: var(--muted); }
.grid3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* add sheet */
#reader { width: 100%; border-radius: 14px; overflow: hidden; background: #000; min-height: 220px; position: relative; }
#reader video { width: 100% !important; display: block; }
.scan-hint { text-align: center; color: var(--muted); font-size: .88rem; margin: 8px 0 0; }
.inline-form { display: flex; gap: 8px; margin-top: 10px; }
.inline-form .inp { margin: 0; }
.inline-form .btn { flex: none; }
.results { display: grid; gap: 8px; margin-top: 12px; }
.status-msg { text-align: center; color: var(--muted); padding: 18px 0; }
.spinner { width: 26px; height: 26px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 8px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* edit form */
.edit-top { display: flex; gap: 14px; align-items: flex-start; }
.edit-top .cover { width: 108px; flex: none; }
.cover-actions { display: grid; gap: 6px; flex: 1; }
.cover-actions .btn { padding: 9px 10px; font-size: .86rem; }
.cover-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; margin-top: 10px; }
.cover-grid button { border: 2px solid transparent; padding: 0; border-radius: 5px; background: none; }
.cover-grid button.on { border-color: var(--accent); }
.cover-grid img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; border-radius: 3px; background: var(--paper-2); }
.note { background: color-mix(in srgb, var(--reading) 16%, var(--card)); border-radius: 12px; padding: 10px 12px; font-size: .88rem; margin-top: 12px; }
.note.bad { background: color-mix(in srgb, #b3402a 14%, var(--card)); }
.save-bar { position: sticky; bottom: calc(-24px - env(safe-area-inset-bottom)); background: var(--paper); padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); margin-top: 16px; display: flex; gap: 8px; }
.save-bar .btn { flex: 1; }

/* detail */
.detail-hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 6px 0 4px; }
.detail-hero .cover { width: 180px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.detail-hero h2 { font-family: var(--serif); font-weight: 700; font-size: 1.5rem; margin: 16px 0 2px; line-height: 1.15; }
.detail-hero .by { color: var(--muted); }
.detail-hero .ser { font-style: italic; margin-top: 4px; font-size: .92rem; }
.facts { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 12px 0; }
.synopsis { white-space: pre-line; font-size: .96rem; }
.synopsis.clamp { display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; }
h4 { font-family: var(--serif); font-weight: 600; font-size: 1.02rem; margin: 18px 0 8px; }
.mini-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.mini-row .sslot { width: 62px; }
.detail-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
.detail-actions .wide { grid-column: 1 / -1; text-align: center; text-decoration: none; display: block; }

/* tbr */
.tbr-stage { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 10px 0; }
.tbr-stage .cover { width: 170px; transition: transform .2s; }
.tbr-stage .cover.spin { animation: wobble .12s linear infinite; }
@keyframes wobble { 50% { transform: rotate(-2deg) scale(.97); } }
.tbr-stage h3 { font-family: var(--serif); margin: 14px 0 2px; font-size: 1.3rem; }

/* menu */
.menu-list { display: grid; gap: 8px; }
.menu-list button, .menu-list label { text-align: left; display: flex; align-items: center; gap: 10px; }

/* login */
.login { position: fixed; inset: 0; z-index: 80; background: var(--paper); display: grid; place-items: center; padding: 24px 16px; overflow-y: auto; }
.login-card { width: 100%; max-width: 380px; text-align: center; }
.login-card h1 { font-family: var(--serif); font-size: 2rem; margin: 10px 0 4px; }
.login-card p { color: var(--muted); margin: 0 0 16px; }
.login-card .inp { margin-bottom: 10px; }
.mini-shelf { display: flex; justify-content: center; align-items: flex-end; gap: 4px; height: 70px; border-bottom: 10px solid var(--wood-2); width: 160px; margin: 0 auto; }
.mini-shelf i { display: block; width: 18px; border-radius: 2px 2px 0 0; }

/* toast */
.toast {
  position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 100;
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: .9rem;
  box-shadow: var(--shadow); animation: fade .2s; max-width: calc(100% - 32px); text-align: center;
}

/* screenshot mode (for bookstagram) */
body.display-mode .top, body.display-mode .fab, body.display-mode .banner { display: none; }
body.display-mode main { padding-top: calc(20px + env(safe-area-inset-top)); }
.exit-display { position: fixed; top: calc(8px + env(safe-area-inset-top)); right: 8px; z-index: 40; opacity: .35; }
</style>
</head>
<body>

      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" data-view="shelf">Shelf</button>
    <button role="tab" data-view="list">List</button>
    <button role="tab" data-view="series">Series</button>
  </div>
  <div class="filters">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

      <select id="fGenre" aria-label="Genre"><option value="">All genres</option></select>

    </div>

</header>

<div class="banner hidden" id="localBanner">
  Books are only being saved on this device for now. Follow <b>SETUP.md</b> (Part 2) to sync your phone and laptop.
</div>

<div class="banner note bad hidden" id="unsavedBanner" role="alert"></div>

<main id="view"></main>

<button class="fab" id="addBtn" aria-label="Add a book">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  Add book
</button>

<div id="sheetRoot"></div>
<div id="loginRoot"></div>

<script type="module">
import * as config from './firebase-config.js';
const firebaseConfig = config.firebaseConfig;
const GBOOKS_KEY = (config.googleBooksKey || '').trim();

const FB = 'https://www.gstatic.com/firebasejs/10.12.2';
const SCANNER_SRC = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';

/* ═════════════ Small helpers ═════════════ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const hash = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
const isTouch = matchMedia('(pointer: coarse)').matches;

function toast(msg, ms = 2400) {
  $$('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// Google Books: uses your own key if you added one (SETUP.md 2f). If Google
// refuses (daily allowance used up), we skip it for a while and rely on Open Library.
let gbooksPausedUntil = 0;
async function gbooks(pathAndQuery) {
  if (Date.now() < gbooksPausedUntil) throw new Error('Google Books paused');
  const url = 'https://www.googleapis.com/books/v1/' + pathAndQuery;
  const withKey = GBOOKS_KEY ? url + (url.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(GBOOKS_KEY) : url;
  try {
    return await getJSON(withKey);
  } catch (e) {
    if (GBOOKS_KEY && /HTTP 40[03]/.test(e.message)) { try { return await getJSON(url); } catch {} }
    if (/HTTP 429|HTTP 403/.test(e.message)) gbooksPausedUntil = Date.now() + 10 * 60 * 1000;
    throw e;
  }
}

/* ═════════════ Storage: local (this device) or Firebase (synced) ═════════════ */
const hasFirebase = firebaseConfig && firebaseConfig.apiKey && !String(firebaseConfig.apiKey).includes('PASTE');

// Your settings (like your genre list) are saved as one extra record next to your books,
// so they sync between devices without any extra Firebase setup.
const SETTINGS_ID = 'app-settings';

/* ── Saving safely ── */
// Firebase refuses a whole book if one field is "undefined" or the record is over 1 MB,
// so tidy every book first and shrink oversized uploaded cover photos.
async function prepareForSave(b) {
  const data = {};
  for (const [k, v] of Object.entries(b)) {
    if (v === undefined || typeof v === 'function' || k.startsWith('_') || k === 'coverOptions') continue;
    data[k] = (typeof v === 'number' && !isFinite(v)) ? null : v;
  }
  if (typeof data.cover === 'string' && data.cover.startsWith('data:') && data.cover.length > 300000) {
    data.cover = await shrinkDataUrl(data.cover);
  }
  if (JSON.stringify(data).length > 900000) throw { code: 'too-big' };
  return data;
}

// Edits that couldn't be saved are kept on this device until they go through.
let unsaved = lsGet('bookshelf.unsaved.v1', {});
function explainSaveError(e) {
  const code = (e && e.code) || '', msg = String((e && e.message) || '');
  if (code === 'too-big' || /exceeds the maximum|too large|maximum allowed size/i.test(msg)) return 'the book’s details are too big to save (usually an uploaded cover photo). Try a smaller photo or paste an image link instead.';
  if (code === 'storage-full') return 'this device’s storage for the app is full. Setting up syncing (SETUP.md, Part 2) removes this limit.';
  if (code === 'resource-exhausted') return 'Firebase’s free daily allowance has been used up. It resets overnight; tap Try again tomorrow.';
  if (code === 'permission-denied' || code === 'unauthenticated') return 'you seem to be signed out on this device. Sign in again, then tap Try again.';
  if (code === 'unavailable') return 'this device’s saved copy of your library stopped responding (a known iPhone/Safari glitch). The app restarts itself to fix it and then tries again automatically.';
  if (code === 'invalid-argument') return 'Firebase didn’t accept one of the details (' + msg.slice(0, 120) + ').';
  return (code || 'unknown problem') + (msg ? ': ' + msg.slice(0, 120) : '');
}
function saveFailed(b, e) {
  console.error('Save failed', b && b.title, e);
  unsaved[b.id] = { book: b, why: explainSaveError(e), at: Date.now() };
  lsSet('bookshelf.unsaved.v1', unsaved);
  renderUnsaved();
  toast('Couldn’t save “' + (b.title || 'this book') + '”. Your changes are kept, see the note at the top.', 5000);
}
function saveSucceeded(id) {
  if (!unsaved[id]) return;
  delete unsaved[id];
  lsSet('bookshelf.unsaved.v1', unsaved);
  renderUnsaved();
}
function renderUnsaved() {
  const box = $('#unsavedBanner');
  const list = Object.values(unsaved);
  box.classList.toggle('hidden', !list.length);
  if (!list.length) { box.innerHTML = ''; return; }
  box.innerHTML = `<b>⚠️ ${list.length === 1 ? '1 change' : list.length + ' changes'} not saved yet</b>
    ${list.map(u => `<div style="margin-top:6px"><b>${esc(u.book.title || 'Untitled')}</b>: ${esc(u.why)}</div>`).join('')}
    <div style="display:flex;gap:14px;margin-top:6px">
      <button class="link-btn" id="unsavedRetry">Try again</button>
      ${list.length === 1 ? `<button class="link-btn" id="unsavedEdit">Edit it</button>` : ''}
      <button class="link-btn" id="unsavedDrop" style="color:var(--muted)">Discard</button>
    </div>`;
  $('#unsavedRetry').onclick = () => { list.forEach(u => store.save({ ...u.book, updatedAt: Date.now() })); toast('Trying again…'); };
  if ($('#unsavedEdit')) $('#unsavedEdit').onclick = () => openEdit(list[0].book);
  $('#unsavedDrop').onclick = () => { if (confirm('Throw away these unsaved changes?')) { unsaved = {}; lsSet('bookshelf.unsaved.v1', unsaved); renderUnsaved(); } };
}

// Resize an image so neither side is too big, then compress until it's comfortably small.
function drawToJpeg(img, maxW = 600, maxH = 900, maxBytes = 200000) {
  const scale = Math.min(1, maxW / img.width, maxH / img.height);
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(img.width * scale)); c.height = Math.max(1, Math.round(img.height * scale));
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  let q = 0.82, out = c.toDataURL('image/jpeg', q);
  while (out.length > maxBytes * 1.37 && q > 0.4) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
  return out;
}
function shrinkDataUrl(url) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(drawToJpeg(img));
    img.onerror = () => resolve(url);
    img.src = url;
  });
}

class LocalStore {
  constructor() { this.key = 'bookshelf.books.v1'; this.books = lsGet(this.key, []); this.meta = lsGet('bookshelf.settings.v1', null); }
  async start(onChange) { this.onChange = onChange; onChange(this.books, true, this.meta); }
  persist() { lsSet(this.key, this.books); this.onChange([...this.books], true, this.meta); }
  async save(b) {
    let data;
    try { data = await prepareForSave(b); } catch (e) { return saveFailed(b, e); }
    const before = this.books.slice();
    const i = this.books.findIndex(x => x.id === b.id); if (i >= 0) this.books[i] = data; else this.books.push(data);
    if (!lsSet(this.key, this.books)) { this.books = before; return saveFailed(b, { code: 'storage-full' }); }
    saveSucceeded(b.id);
    this.onChange([...this.books], true, this.meta);
  }
  async remove(id) { this.books = this.books.filter(b => b.id !== id); this.persist(); }
  async saveMeta(m) { this.meta = m; lsSet('bookshelf.settings.v1', m); this.onChange([...this.books], true, this.meta); }
  signOut() {}
}

class FirebaseStore {
  async start(onChange) {
    const [{ initializeApp }, A, F] = await Promise.all([
      import(`${FB}/firebase-app.js`), import(`${FB}/firebase-auth.js`), import(`${FB}/firebase-firestore.js`)
    ]);
    this.A = A; this.F = F;
    const app = initializeApp(firebaseConfig);
    this.auth = A.getAuth(app);
    // Normally Firebase keeps a copy of your library on the device (for speed and offline use).
    // If that copy keeps breaking on this device (an iPhone/Safari glitch), use a simpler mode instead.
    this.memoryMode = lsGet('bookshelf.memoryCache', false);
    try {
      this.db = F.initializeFirestore(app, {
        ignoreUndefinedProperties: true,
        localCache: this.memoryMode ? F.memoryLocalCache() : F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }),
      });
    } catch { this.db = F.getFirestore(app); }
    A.onAuthStateChanged(this.auth, user => {
      if (this.unsub) { this.unsub(); this.unsub = null; }
      if (!user) { onChange([], false); showLogin(this); return; }
      hideLogin();
      this.col = F.collection(this.db, 'users', user.uid, 'books');
      this.unsub = F.onSnapshot(this.col,
        snap => {
          const settings = snap.docs.find(d => d.id === SETTINGS_ID);
          const books = snap.docs.filter(d => d.id !== SETTINGS_ID).map(d => ({ id: d.id, ...d.data() }));
          onChange(books, !snap.metadata.fromCache || snap.docs.length > 0, settings ? settings.data() : null);
        },
        err => { if (!this.fixStorage(err)) toast('Sync problem: ' + (err.code || err.message) + ' (see SETUP.md, Part 2)', 6000); });
    });
  }
  // "unavailable" here means the on-device copy stopped responding. Restarting fixes it;
  // if it happens again soon after, switch this device to the simpler mode for good.
  fixStorage(e, force = false) {
    const broken = e && (e.code === 'unavailable' || /indexed ?db|indexed database/i.test(String(e.message)));
    if (!force && (!broken || this.memoryMode)) return false;
    if (this.restarting) return true;
    this.restarting = true;
    const last = lsGet('bookshelf.storageFailAt', 0);
    if (Date.now() - last < 15 * 60 * 1000) lsSet('bookshelf.memoryCache', true); // broke again soon after: use the simpler mode
    lsSet('bookshelf.storageFailAt', Date.now());
    toast('Fixing a storage problem on this device. Restarting, your changes are kept…', 3500);
    // Throw away this device's stuck copy (your books are safe in Firebase and download again),
    // then restart. Unsaved edits are kept separately and saved automatically after the restart.
    (async () => {
      try { await this.F.terminate(this.db); } catch {}
      try {
        const dbs = indexedDB.databases ? await indexedDB.databases() : [];
        const names = dbs.map(d => d.name).filter(n => n && n.startsWith('firestore/'));
        if (!names.length) names.push(`firestore/[DEFAULT]/${firebaseConfig.projectId}/main`);
        await Promise.all(names.map(n => new Promise(res => {
          const req = indexedDB.deleteDatabase(n);
          req.onsuccess = req.onerror = req.onblocked = () => res();
        })));
      } catch {}
      setTimeout(() => location.reload(), 600);
    })();
    return true;
  }
  async save(b) {
    // Not awaited on purpose: works offline and syncs when back online.
    let data;
    try { data = await prepareForSave(b); } catch (e) { return saveFailed(b, e); }
    this.F.setDoc(this.F.doc(this.col, b.id), data).then(() => saveSucceeded(b.id), e => { saveFailed(b, e); this.fixStorage(e); });
  }
  async remove(id) { this.F.deleteDoc(this.F.doc(this.col, id)).catch(e => { if (!this.fixStorage(e)) toast('Could not delete: ' + explainSaveError(e), 5000); }); }
  async saveMeta(m) { this.F.setDoc(this.F.doc(this.col, SETTINGS_ID), m).catch(e => { if (!this.fixStorage(e)) toast('Could not save your genre list: ' + explainSaveError(e), 5000); }); }
  signOut() { this.A.signOut(this.auth); }
}

/* ═════════════ App state ═════════════ */
const state = {
  books: [],
  view: lsGet('bookshelf.view', 'shelf'),
  q: '',
  status: lsGet('bookshelf.fStatus', ''),
  format: lsGet('bookshelf.fFormat', ''),
  genre: lsGet('bookshelf.fGenre', ''),
  sort: lsGet('bookshelf.fSort', 'recent'),
  // 'stack' = Kindle-style pile you tap to open; 'side' = side by side; 'off' = mixed in
  seriesMode: lsGet('bookshelf.seriesMode', lsGet('bookshelf.groupSeries', true) ? 'stack' : 'off'),
};
const store = hasFirebase ? new FirebaseStore() : new LocalStore();
if (!hasFirebase) $('#localBanner').classList.remove('hidden');

/* ═════════════ Covers ═════════════ */
function coverHTML(b, { badges = true } = {}) {
  const hue = hash((b.title || '') + (b.author || '')) % 360;
  let badge = '';
  if (badges) {
    if (b.status === 'Read') badge += `<span class="badge read" title="Read"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>`;
    if (b.status === 'Reading') badge += `<span class="badge reading" title="Reading"></span>`;
    if (b.format === 'Kindle' || b.format === 'Both') badge += `<span class="badge kindle" title="${b.format === 'Both' ? 'Physical + Kindle' : 'Kindle'}">${b.format === 'Both' ? 'K+' : 'K'}</span>`;
  }
  return `<div class="cover" style="--h:${hue}">
    <div class="fb"><span class="fb-t">${esc(b.title || 'Untitled')}</span><span class="fb-a">${esc(b.author || '')}</span></div>
    ${b.cover ? `<img src="${esc(b.cover)}" alt="${esc(b.title)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}
    ${badge}
  </div>`;
}

/* ═════════════ Filtering & sorting ═════════════ */
const sortTitle = t => norm(t).replace(/^(the|a|an) /, '');
// Sort key by surname, the way a real shelf is organised: "Sarah J. Maas" → Maas,
// "Ursula K. Le Guin" → Le Guin, "Martin Luther King Jr." → King. First names break ties.
const SURNAME_PARTICLES = new Set(['le', 'la', 'de', 'du', 'da', 'di', 'del', 'della', 'van', 'von', 'der', 'den', 'st', 'st.', 'mac', 'o\'']);
function authorLast(a) {
  const first = String(a || '').split(/,|&| and /)[0].trim();
  const parts = first.split(/\s+/).filter(p => !/^(jr\.?|sr\.?|ii|iii|iv|phd)$/i.test(p));
  if (!parts.length) return '';
  let i = parts.length - 1;
  while (i > 0 && SURNAME_PARTICLES.has(parts[i - 1].toLowerCase())) i--;
  return norm(parts.slice(i).join(' ') + ' ' + parts.slice(0, i).join(' '));
}
const seriesKey = s => norm(s);

function filtered() {
  const q = norm(state.q);
  let list = state.books.filter(b =>
    (!q || norm(`${b.title} ${b.author} ${b.series}`).includes(q)) &&
    (!state.status || (b.status || 'Unread') === state.status) &&
    (!state.format || b.format === state.format || (state.format !== 'Both' && b.format === 'Both')) &&
    (!state.genre || splitGenres(b.genre).includes(state.genre))
  );
  const by = {
    recent: (a, b) => (b.addedAt || 0) - (a.addedAt || 0),
    title: (a, b) => sortTitle(a.title).localeCompare(sortTitle(b.title)),
    author: (a, b) => authorLast(a.author).localeCompare(authorLast(b.author)) || seriesCmp(a, b),
    series: seriesCmp,
  }[state.sort] || ((a, b) => 0);
  list.sort(by);
  return state.seriesMode !== 'off' || state.sort === 'series' ? keepSeriesTogether(list) : list;
}
const seriesNo = b => (b.seriesNum === '' || b.seriesNum == null || isNaN(b.seriesNum)) ? 999 : Number(b.seriesNum);
function seriesCmp(a, b) {
  const sa = seriesKey(a.series), sb = seriesKey(b.series);
  if (sa && !sb) return -1;
  if (!sa && sb) return 1;
  if (sa !== sb) return sa.localeCompare(sb);
  if (sa) return seriesNo(a) - seriesNo(b);
  return sortTitle(a.title).localeCompare(sortTitle(b.title));
}
// Books from the same series sit side by side, in series order, at the spot where
// the first of them would appear in your chosen sort.
function keepSeriesTogether(list) {
  const bySeries = new Map();
  list.forEach(b => { const k = seriesKey(b.series); if (k) { if (!bySeries.has(k)) bySeries.set(k, []); bySeries.get(k).push(b); } });
  const out = [], placed = new Set();
  for (const b of list) {
    const k = seriesKey(b.series);
    if (!k) { out.push(b); continue; }
    if (placed.has(k)) continue;
    placed.add(k);
    out.push(...bySeries.get(k).sort((x, y) => seriesNo(x) - seriesNo(y) || sortTitle(x.title).localeCompare(sortTitle(y.title))));
  }
  return out;
}

/* ═════════════ Rendering ═════════════ */
function render() {
  const books = state.books;
  const unread = books.filter(b => (b.status || 'Unread') === 'Unread').length;
  $('#stats').textContent = books.length
    ? `${books.length} book${books.length === 1 ? '' : 's'} · ${unread} unread · ${books.filter(b => b.status === 'Read').length} read`
    : 'Your shelf is waiting';

  $$('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === state.view)));

  // genre options from your own books
  const genres = uniq(books.flatMap(b => splitGenres(b.genre))).sort();
  const gSel = $('#fGenre');
  gSel.innerHTML = `<option value="">All genres</option>` + genres.map(g => `<option ${g === state.genre ? 'selected' : ''}>${esc(g)}</option>`).join('');
  $('#fStatus').value = state.status; $('#fFormat').value = state.format; $('#fSort').value = state.sort;
  ['#fStatus', '#fFormat', '#fGenre'].forEach(s => $(s).classList.toggle('on', !!$(s).value));
  $('#fSort').classList.toggle('on', state.sort !== 'recent');
  $('#fSeries').value = state.seriesMode;
  $('#fSeries').classList.toggle('hidden', state.view === 'series');

  const v = $('#view');
  if (!books.length) {
    v.innerHTML = `<div class="empty"><h2>Your shelves are empty</h2><p>Tap <b>Add book</b> and scan the barcode on the back of a book to get started.</p></div>`;
    return;
  }
  const list = filtered();
  if (!list.length) {
    v.innerHTML = `<div class="empty"><h2>No matches</h2><p>Nothing on your shelves matches these filters.</p><button class="btn ghost" id="clearF">Clear filters</button></div>`;
    $('#clearF').onclick = clearFilters;
    return;
  }
  if (state.view === 'list') v.innerHTML = renderList(list);
  else if (state.view === 'series') v.innerHTML = renderSeries(list);
  else v.innerHTML = renderShelf(list);
}

// In "stacked" mode, 2+ books from one series become a single pile (like Kindle collections).
function shelfItems(list) {
  if (state.seriesMode !== 'stack') return list;
  const count = new Map();
  list.forEach(b => { const k = seriesKey(b.series); if (k) count.set(k, (count.get(k) || 0) + 1); });
  const out = [], done = new Set();
  for (const b of list) {
    const k = seriesKey(b.series);
    if (!k || count.get(k) < 2) { out.push(b); continue; }
    if (done.has(k)) continue;
    done.add(k);
    out.push({ stack: true, key: k, books: list.filter(x => seriesKey(x.series) === k) }); // already in series order
  }
  return out;
}

function stackHTML(s) {
  const [front, ...rest] = s.books;
  const behind = rest.slice(0, 2).reverse();
  return `<div class="stack">
    ${behind.map((b, i) => `<div class="stack-back l${behind.length - i}">${coverHTML(b, { badges: false })}</div>`).join('')}
    <div class="stack-front">${coverHTML(front, { badges: false })}</div>
    <span class="stack-count">${s.books.length}</span>
  </div>`;
}

function renderShelf(list) {
  return `<div class="shelf-wrap"><div class="bookcase">${shelfItems(list).map(it => {
    if (it.stack) {
      return `<div class="slot"><button data-stack="${esc(it.key)}" style="width:100%" aria-label="${esc(it.books[0].series)}, ${it.books.length} books">${stackHTML(it)}</button></div>`;
    }
    const h = 92 + (hash(it.id) % 9); // small height variation, like real books
    return `<div class="slot"><button data-open="${it.id}" style="width:${h}%" aria-label="${esc(it.title)}">${coverHTML(it)}</button></div>`;
  }).join('')}</div></div>`;
}

// The "folder" for a series: every book you own in it, in order, with gaps for missing ones.
function openSeriesFolder(key) {
  const g = seriesGroups(state.books).get(key);
  if (!g) return;
  const slots = seriesSlots(g);
  const owned = slots.filter(s => !s.missing && s.n !== '?').length;
  const read = g.books.filter(b => b.status === 'Read').length;
  const body = openSheet(g.name, `
    <div style="display:flex;align-items:center;gap:8px;margin-top:-4px">
      <div class="sub" style="color:var(--muted);flex:1">${esc(g.books[0].author || '')} · ${g.total ? `${owned} of ${g.total} owned` : `${g.books.length} owned`}${read ? ` · ${read} read` : ''}</div>
      <button class="icon-btn" id="folderEdit">✎ Edit series</button>
    </div>
    ${g.total ? `<div class="progress"><span style="width:${Math.min(100, Math.round(owned / g.total * 100))}%"></span></div>` : ''}
    <div class="folder-grid">${slots.map(s => s.missing
      ? missingSlotHTML(key, s.n)
      : `<div class="sslot"><button data-open="${s.b.id}">${coverHTML(s.b)}</button><div class="num">#${esc(s.n)}</div><div class="ft">${esc(s.b.title)}</div></div>`).join('')}
    </div>
  `);
  $$('[data-open]', body).forEach(x => x.onclick = () => openDetail(x.dataset.open));
  $$('[data-addto]', body).forEach(x => x.onclick = () => addToSeries(x.dataset.addto, x.dataset.n));
  $('#folderEdit', body).onclick = () => openSeriesEditor(key);
}

// Edit a series: rename it, set how many books it has, renumber, remove books,
// add books already on your shelf, or add a brand-new book straight into it.
function openSeriesEditor(key) {
  const g = key ? seriesGroups(state.books).get(key) : { name: '', books: [], total: 0 };
  if (!g) return;
  const byId = id => state.books.find(b => b.id === id);
  let rows = g.books.slice().sort((a, b) => seriesNo(a) - seriesNo(b)).map(b => ({ id: b.id, num: b.seriesNum ?? '', keep: true, original: true }));
  const body = openSheet(key ? 'Edit series' : 'New series', `
    <label class="f">Series name<input class="inp" id="seName" value="${esc(g.name)}" placeholder="e.g. Throne of Glass" autocomplete="off"></label>
    <label class="f" style="max-width:60%">How many books in the series?<input class="inp" id="seTotal" value="${esc(g.total || '')}" inputmode="numeric" placeholder="e.g. 8"></label>
    <h4>Books in this series</h4>
    <div class="list" id="seRows" style="grid-template-columns:1fr"></div>
    <div style="display:grid;gap:8px;margin-top:10px">
      <button class="btn ghost" type="button" id="seAddOwned">+ Add a book from my shelf</button>
      <div id="sePicker" class="hidden">
        <input class="inp" id="seSearch" type="search" placeholder="Search my books" autocomplete="off">
        <div class="list" id="seResults" style="grid-template-columns:1fr;margin-top:8px;max-height:320px;overflow-y:auto"></div>
      </div>
      <button class="btn ghost" type="button" id="seAddNew">+ Add a new book (scan or search)</button>
    </div>
    <div class="save-bar"><button class="btn ghost" type="button" data-close>Cancel</button><button class="btn" type="button" id="seSave">Save series</button></div>
  `);
  const nextNum = () => {
    const used = new Set(rows.filter(r => r.keep).map(r => Math.floor(Number(r.num))).filter(n => n > 0));
    let n = 1; while (used.has(n)) n++; return n;
  };
  function drawRows() {
    const box = $('#seRows', body);
    if (!rows.length) { box.innerHTML = `<p class="status-msg" style="padding:6px 0">No books yet. Add some below.</p>`; return; }
    rows.sort((a, b) => (Number(a.num) || 999) - (Number(b.num) || 999));
    box.innerHTML = rows.map((r, i) => {
      const b = byId(r.id);
      if (!b) return '';
      return `<div class="row" style="padding:8px;${r.keep ? '' : 'opacity:.45'}">
        <div style="width:40px;flex:none">${coverHTML(b, { badges: false })}</div>
        <div class="meta"><div class="t" style="font-size:.95rem;${r.keep ? '' : 'text-decoration:line-through'}">${esc(b.title)}</div><div class="a" style="font-size:.8rem">${esc(b.author)}${b.series && seriesKey(b.series) !== key && r.keep && !r.original ? ` · moving from ${esc(b.series)}` : ''}</div></div>
        ${r.keep ? `<label style="font-size:.75rem;color:var(--muted);text-align:center">Book #<input class="inp" data-num="${i}" value="${esc(r.num)}" inputmode="decimal" style="width:56px;margin:2px 0 0;padding:6px;text-align:center"></label>
          <button class="icon-btn" type="button" data-rm="${i}" aria-label="Take out of this series">✕</button>`
        : `<button class="link-btn" type="button" data-undo="${i}">Undo</button>`}
      </div>`;
    }).join('');
    $$('[data-num]', box).forEach(x => x.oninput = () => { rows[+x.dataset.num].num = x.value; });
    $$('[data-num]', box).forEach(x => x.onchange = drawRows);
    $$('[data-rm]', box).forEach(x => x.onclick = () => { const r = rows[+x.dataset.rm]; if (r.original) r.keep = false; else rows.splice(+x.dataset.rm, 1); drawRows(); });
    $$('[data-undo]', box).forEach(x => x.onclick = () => { rows[+x.dataset.undo].keep = true; drawRows(); });
  }
  function drawPicker() {
    const q = norm($('#seSearch', body).value);
    const inRows = new Set(rows.map(r => r.id));
    const list = state.books.filter(b => !inRows.has(b.id) && (!q || norm(`${b.title} ${b.author} ${b.series}`).includes(q)))
      .sort((a, b) => authorLast(a.author).localeCompare(authorLast(b.author)) || sortTitle(a.title).localeCompare(sortTitle(b.title))).slice(0, 60);
    $('#seResults', body).innerHTML = list.length ? list.map(b => `<button class="row" type="button" data-pick="${b.id}" style="padding:8px">
        <div style="width:36px;flex:none">${coverHTML(b, { badges: false })}</div>
        <div class="meta"><div class="t" style="font-size:.92rem">${esc(b.title)}</div><div class="a" style="font-size:.8rem">${esc(b.author)}${b.series ? ` · in ${esc(seriesLabel(b))}` : ''}</div></div>
        <span class="chev">+</span></button>`).join('')
      : `<p class="status-msg" style="padding:6px 0">No matching books.</p>`;
    $$('[data-pick]', body).forEach(x => x.onclick = () => {
      rows.push({ id: x.dataset.pick, num: nextNum(), keep: true, original: false });
      drawRows(); drawPicker();
      toast('Added. Check its book number above');
    });
  }
  $('#seAddOwned', body).onclick = () => { $('#sePicker', body).classList.toggle('hidden'); drawPicker(); if (!isTouch) $('#seSearch', body).focus(); };
  $('#seSearch', body).oninput = drawPicker;

  // Apply everything; returns the saved series name (or null if something needs fixing).
  function apply() {
    const name = $('#seName', body).value.trim();
    const kept = rows.filter(r => r.keep);
    if (!name && kept.length) { toast('Give the series a name first'); $('#seName', body).focus(); return null; }
    const totalRaw = parseInt($('#seTotal', body).value, 10);
    const total = isNaN(totalRaw) ? null : totalRaw;
    let changed = 0;
    for (const r of rows) {
      const b = byId(r.id); if (!b) continue;
      let next;
      if (!r.keep) next = { ...b, series: '', seriesNum: null, seriesTotal: null };
      else { const n = parseFloat(String(r.num).replace(',', '.')); next = { ...b, series: name, seriesNum: isNaN(n) ? null : n, seriesTotal: total }; }
      if (next.series !== b.series || next.seriesNum !== b.seriesNum || (next.seriesTotal ?? null) !== (b.seriesTotal ?? null)) {
        store.save({ ...next, updatedAt: Date.now() }); changed++;
      }
    }
    return { name, total, changed };
  }
  $('#seSave', body).onclick = () => {
    const res = apply(); if (!res) return;
    closeSheet();
    toast(res.changed ? `Saved “${res.name || 'series'}”` : 'No changes');
  };
  $('#seAddNew', body).onclick = () => {
    const res = apply(); if (!res) return;
    if (!res.name) { toast('Give the series a name first'); $('#seName', body).focus(); return; }
    openAdd(undefined, { series: res.name, seriesNum: nextNum(), seriesTotal: res.total || '', author: (byId((rows.find(r => r.keep) || {}).id) || {}).author || '' });
  };
  drawRows();
  if (!key) { $('#seAddOwned', body).click(); }
}

function seriesLabel(b) {
  if (!b.series) return '';
  let s = b.series;
  if (b.seriesNum != null && b.seriesNum !== '') s += ` #${b.seriesNum}`;
  return s;
}

function renderList(list) {
  const grouping = state.seriesMode === 'side' || state.sort === 'series';
  const counts = new Map();
  list.forEach(b => { const k = seriesKey(b.series); if (k) counts.set(k, (counts.get(k) || 0) + 1); });
  let prevKey = '';
  return `<div class="list">${shelfItems(list).map(b => {
    if (b.stack) {
      const g = seriesGroups(state.books).get(b.key);
      const nums = b.books.map(x => x.seriesNum).filter(n => n != null && n !== '');
      return `<button class="row" data-stack="${esc(b.key)}">
        <div style="width:52px;flex:none">${stackHTML(b)}</div>
        <div class="meta">
          <div class="t">${esc(b.books[0].series)}</div>
          <div class="a">${esc(b.books[0].author)}</div>
          <div class="s">${b.books.length} books${g && g.total ? ` of ${g.total}` : ''}${nums.length ? ` · #${nums.join(', #')}` : ''}</div>
        </div>
        <span class="chev">›</span>
      </button>`;
    }
    const k = seriesKey(b.series);
    const header = grouping && k && k !== prevKey && counts.get(k) > 1
      ? `<div class="list-group-h">${esc(b.series)} <span>· ${counts.get(k)} on your shelf</span></div>` : '';
    prevKey = k;
    return header + `
    <button class="row" data-open="${b.id}">
      ${coverHTML(b, { badges: false })}
      <div class="meta">
        <div class="t">${esc(b.title)}</div>
        <div class="a">${esc(b.author)}</div>
        ${b.series ? `<div class="s">${esc(seriesLabel(b))}</div>` : ''}
        <div class="pills">
          ${b.status && b.status !== 'Unread' ? `<span class="pill ${b.status.toLowerCase()}">${b.status}</span>` : `<span class="pill">Unread</span>`}
          ${b.format && b.format !== 'Physical' ? `<span class="pill kindle">${b.format === 'Both' ? 'Physical + Kindle' : 'Kindle'}</span>` : ''}
          ${splitGenres(b.genre).map(g => `<span class="pill">${esc(g)}</span>`).join('')}
        </div>
      </div>
    </button>`;
  }).join('')}</div>`;
}

function seriesGroups(allBooks) {
  const groups = new Map();
  for (const b of allBooks) {
    if (!b.series) continue;
    const k = seriesKey(b.series);
    if (!groups.has(k)) groups.set(k, { name: b.series, books: [], total: 0 });
    const g = groups.get(k);
    g.books.push(b);
    g.total = Math.max(g.total, Number(b.seriesTotal) || 0);
  }
  return groups;
}

function seriesSlots(g) {
  const numbered = g.books.filter(b => b.seriesNum != null && b.seriesNum !== '' && !isNaN(b.seriesNum));
  const maxNum = Math.max(0, ...numbered.map(b => Math.floor(Number(b.seriesNum))));
  const end = Math.max(g.total, maxNum);
  const slots = [];
  for (let n = 1; n <= end; n++) {
    const owned = numbered.filter(b => Math.floor(Number(b.seriesNum)) === n).sort((a, b) => a.seriesNum - b.seriesNum);
    if (owned.length) owned.forEach(b => slots.push({ n: b.seriesNum, b }));
    else slots.push({ n, missing: true });
  }
  g.books.filter(b => !numbered.includes(b)).forEach(b => slots.push({ n: '?', b }));
  return slots;
}

// A dashed gap for a book you don't own yet. Tap it to add that book straight into the series.
function missingSlotHTML(key, n) {
  return `<div class="sslot"><button class="missing" data-addto="${esc(key)}" data-n="${esc(n)}" aria-label="Add book ${esc(n)}">${esc(n)}<small>+ Add</small></button><div class="num">Missing</div></div>`;
}
function addToSeries(key, n) {
  const g = seriesGroups(state.books).get(key);
  if (!g) return;
  openAdd(undefined, { series: g.name, seriesNum: Number(n), seriesTotal: g.total || '', author: g.books[0].author || '' });
}

function renderSeries(list) {
  const groups = seriesGroups(state.books); // gaps are based on everything you own...
  const showKeys = new Set(list.filter(b => b.series).map(b => seriesKey(b.series))); // ...but only series matching filters are shown
  const shown = [...groups.entries()].filter(([k]) => showKeys.has(k)).sort((a, b) => sortTitle(a[1].name).localeCompare(sortTitle(b[1].name)));
  const standalone = list.filter(b => !b.series).length;
  const tools = `<div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="btn ghost" data-newseries>+ New series</button></div>`;
  if (!shown.length) return tools + `<div class="empty"><h2>No series yet</h2><p>Tap <b>+ New series</b> to make one from books on your shelf, or add a series name to a book when you edit it.</p></div>`;
  return tools + shown.map(([key, g]) => {
    const slots = seriesSlots(g);
    const known = slots.filter(s => s.n !== '?');
    const ownedCount = known.filter(s => !s.missing).length;
    const totalTxt = g.total ? `${ownedCount} of ${g.total} owned` : `${g.books.length} owned`;
    const missing = known.filter(s => s.missing).length;
    const pct = g.total ? Math.min(100, Math.round(ownedCount / g.total * 100)) : 100;
    return `<section class="series-card">
      <div style="display:flex;align-items:flex-start;gap:8px">
        <h3 style="flex:1">${esc(g.name)}</h3>
        <button class="icon-btn" data-editseries="${esc(key)}" aria-label="Edit ${esc(g.name)}">✎ Edit</button>
      </div>
      <div class="sub">${esc(g.books[0].author || '')} · ${totalTxt}${missing ? ` · missing ${missing}` : ''}</div>
      ${g.total ? `<div class="progress"><span style="width:${pct}%"></span></div>` : ''}
      <div class="series-row">${slots.map(s => s.missing
        ? missingSlotHTML(key, s.n)
        : `<div class="sslot"><button data-open="${s.b.id}">${coverHTML(s.b)}</button><div class="num">#${esc(s.n)}</div></div>`).join('')}
        <div class="sslot"><button class="missing add-more" data-editseries="${esc(key)}" aria-label="Add books to ${esc(g.name)}">+<small>Add books</small></button></div>
      </div>
    </section>`;
  }).join('') + (standalone ? `<p class="empty" style="padding:8px">+ ${standalone} standalone book${standalone === 1 ? '' : 's'} not in a series</p>` : '');
}

/* ═════════════ Sheets (pop-up panels) ═════════════ */
let sheetCleanup = null;
function openSheet(title, bodyHTML, { onClose } = {}) {
  closeSheet(true);
  const root = $('#sheetRoot');
  root.innerHTML = `<div class="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="grab"></div>
    <div class="sheet-head"><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="sheet-body">${bodyHTML}</div></div></div>`;
  const bg = $('.sheet-bg', root);
  bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-close]')) closeSheet(); });
  sheetCleanup = onClose || null;
  document.body.style.overflow = 'hidden';
  if (!history.state || !history.state.sheet) history.pushState({ sheet: 1 }, '');
  return $('.sheet-body', root);
}
function closeSheet(replacing = false) {
  const root = $('#sheetRoot');
  if (!root.innerHTML) return;
  if (sheetCleanup) { try { sheetCleanup(); } catch {} sheetCleanup = null; }
  root.innerHTML = '';
  document.body.style.overflow = '';
  if (!replacing && history.state && history.state.sheet) history.back();
}
addEventListener('popstate', () => { if ($('#sheetRoot').innerHTML) { if (sheetCleanup) { try { sheetCleanup(); } catch {} sheetCleanup = null; } $('#sheetRoot').innerHTML = ''; document.body.style.overflow = ''; } });
addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ═════════════ Book lookups (Google Books + Open Library) ═════════════ */
const cleanText = s => String(s || '')
  .replace(/<br\s*\/?>/gi, '\n').replace(/<\/p>/gi, '\n\n').replace(/<[^>]+>/g, '')
  .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&').replace(/&nbsp;/g, ' ')
  .replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();

function cleanOLDesc(d) {
  let s = typeof d === 'string' ? d : (d && d.value) || '';
  s = s.split(/\n-{3,}|\(\[source\]|\[source\]/i)[0];
  return cleanText(s.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1'));
}

function normIsbn(s) {
  const d = String(s || '').replace(/[^0-9Xx]/g, '').toUpperCase();
  return d.length === 10 || d.length === 13 ? d : null;
}
function isbn10to13(i) {
  if (!i || i.length !== 10) return i;
  const core = '978' + i.slice(0, 9);
  let sum = 0;
  for (let k = 0; k < 12; k++) sum += +core[k] * (k % 2 ? 3 : 1);
  return core + ((10 - (sum % 10)) % 10);
}

function tidySeries(s) {
  return String(s || '').replace(/\s+(series|sequence)\s*$/i, '').replace(/^[\s,;:(#-]+|[\s,;:(#-]+$/g, '').trim();
}
// "Throne of Glass ; 1", "The Hunger Games, #2", "Empyrean (1)", "Shadowhunter Chronicles. The mortal instruments ; bk. 3"
function parseSeries(str) {
  if (!str) return null;
  const m = String(str).match(/^(.*?)[\s,;:(#.-]*(?:book|bk\.?|vol\.?|volume|no\.?|number|#|part)?\s*(\d+(?:\.\d+)?)\)?\s*$/i);
  if (m && m[1].trim()) return { series: tidySeries(m[1]), num: Number(m[2]) };
  return { series: tidySeries(str), num: null };
}
// "Crown of Midnight (Throne of Glass, Book 2)" → title + series
function splitSeriesFromTitle(title, subtitle) {
  let t = String(title || '').trim(), series = '', num = null;
  const m = t.match(/\s*\(([^()]+?),?\s*(?:book|bk\.?|vol\.?|volume|#|no\.?)\s*(\d+(?:\.\d+)?)\)\s*$/i);
  if (m) { series = tidySeries(m[1]); num = Number(m[2]); t = t.slice(0, m.index).trim(); }
  if (!series && subtitle) {
    const s1 = String(subtitle).match(/book\s*(\d+(?:\.\d+)?)\s*(?:of|in)\s*(?:the\s*)?(.+?)(?:\s*series)?$/i);
    const s2 = String(subtitle).match(/^(?:an?|the)\s+(.+?)\s+(?:novel|book)$/i);
    if (s1) { num = Number(s1[1]); series = tidySeries(s1[2]); }
    else if (s2) series = tidySeries(s2[1]);
  }
  return { title: t, series, num };
}

// A book can have several genres, saved as "Fantasy, Romance" (older single-genre books just work).
const splitGenres = s => uniq(String(s || '').split(',').map(g => g.trim()));

// Your genre list: saved once and offered for every book. Starts from these defaults.
const DEFAULT_GENRES = ['Romantasy', 'Fantasy', 'Romance', 'Thriller', 'Mystery', 'Horror', 'Science Fiction', 'Historical Fiction', 'Literary Fiction', 'Contemporary', 'Young Adult', 'Classics', 'Non-fiction', 'Memoir', 'Poetry', 'Graphic Novel'];
const savedGenres = () => (state.meta && Array.isArray(state.meta.genres)) ? state.meta.genres : DEFAULT_GENRES;
const byName = (a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' });
// Everything in your list plus anything already on a book, so nothing is ever lost.
const allGenres = () => uniq([...savedGenres(), ...state.books.flatMap(b => splitGenres(b.genre))]).sort(byName);
function saveGenreList(list) {
  store.saveMeta({ ...(state.meta || {}), genres: uniq(list.map(g => String(g).trim()).filter(Boolean)).sort(byName) });
}
function rememberGenre(g) {
  if (!savedGenres().some(x => norm(x) === norm(g))) saveGenreList([...savedGenres(), g]);
}

function guessGenre(tags) {
  const t = tags.join(' | ').toLowerCase();
  if (!t) return '';
  const has = re => re.test(t);
  if (has(/fantasy/) && has(/romance|love stories/)) return 'Romantasy';
  if (has(/comic|graphic novel|manga/)) return 'Graphic Novel';
  if (has(/poetry/)) return 'Poetry';
  if (has(/horror/)) return 'Horror';
  if (has(/science fiction|sci-fi|dystopi|space opera/)) return 'Science Fiction';
  if (has(/fantasy|magic|dragons|fairy tales/)) return 'Fantasy';
  if (has(/thriller|suspense/)) return 'Thriller';
  if (has(/mystery|detective|crime/)) return 'Mystery';
  if (has(/historical fiction|fiction \/ historical/)) return 'Historical Fiction';
  if (has(/romance|love stories/)) return 'Romance';
  if (has(/young adult/)) return 'Young Adult';
  if (has(/classics|classic literature/)) return 'Classics';
  if (has(/literary/)) return 'Literary Fiction';
  if (has(/fiction/)) return 'Fiction';
  if (has(/biography|memoir|autobiography/)) return 'Memoir';
  if (has(/self-help|history|science|business|psychology|cooking|travel|nonfiction|non-fiction|philosophy/)) return 'Non-fiction';
  return '';
}

const olCover = (id, size = 'L') => `https://covers.openlibrary.org/b/id/${id}-${size}.jpg`;
const yearOf = s => { const m = String(s || '').match(/\b(1[5-9]\d\d|20\d\d)\b/); return m ? m[1] : ''; };

function fromGoogle(item) {
  const v = item.volumeInfo || {};
  const ids = v.industryIdentifiers || [];
  const isbn = ((ids.find(i => i.type === 'ISBN_13') || ids.find(i => i.type === 'ISBN_10')) || {}).identifier || '';
  const covers = [];
  if (v.imageLinks) {
    covers.push(`https://books.google.com/books/publisher/content/images/frontcover/${item.id}?fife=w600-h900&source=gbs_api`);
    const thumb = v.imageLinks.extraLarge || v.imageLinks.large || v.imageLinks.medium || v.imageLinks.thumbnail;
    if (thumb) covers.push(thumb.replace(/^http:/, 'https:').replace('&edge=curl', ''));
  }
  const sNum = v.seriesInfo && v.seriesInfo.bookDisplayNumber ? Number(v.seriesInfo.bookDisplayNumber) : null;
  return {
    source: 'google', title: v.title || '', subtitle: v.subtitle || '', author: (v.authors || []).join(', '),
    synopsis: cleanText(v.description), categories: v.categories || [], year: yearOf(v.publishedDate),
    isbn: isbn10to13(isbn), covers, seriesNum: isNaN(sNum) ? null : sNum,
  };
}

async function googleByIsbn(isbn) {
  const d = await gbooks(`volumes?q=isbn:${isbn}`);
  if (!d.items || !d.items.length) return null;
  let item = d.items[0];
  try { item = await gbooks(`volumes/${item.id}`); } catch {}
  return fromGoogle(item);
}

async function olWorkExtras(workKey) {
  const out = {};
  try {
    const w = await getJSON(`https://openlibrary.org${workKey}.json`);
    out.synopsis = cleanOLDesc(w.description);
    out.subjects = w.subjects || [];
    out.year = yearOf(w.first_publish_date);
    out.covers = (w.covers || []).filter(c => c > 0).slice(0, 6).map(c => olCover(c));
    const aKey = w.authors && w.authors[0] && w.authors[0].author && w.authors[0].author.key;
    if (aKey) out.authorKey = aKey;
  } catch {}
  return out;
}

async function olByIsbn(isbn) {
  const ed = await getJSON(`https://openlibrary.org/isbn/${isbn}.json`);
  const out = { source: 'ol', title: ed.title || '', subtitle: ed.subtitle || '', isbn, covers: [], subjects: [] };
  (ed.covers || []).filter(c => c > 0).forEach(c => out.covers.push(olCover(c)));
  if (ed.series && ed.series.length) { const p = parseSeries(ed.series[0]); out.series = p.series; out.seriesNum = p.num; }
  out.year = yearOf(ed.publish_date);
  const workKey = ed.works && ed.works[0] && ed.works[0].key;
  const extras = workKey ? await olWorkExtras(workKey) : {};
  out.synopsis = extras.synopsis || cleanOLDesc(ed.description);
  out.subjects = extras.subjects || [];
  if (extras.year && (!out.year || extras.year < out.year)) out.year = extras.year;
  (extras.covers || []).forEach(c => out.covers.push(c));
  out.workKey = workKey;
  const aKey = (ed.authors && ed.authors[0] && ed.authors[0].key) || extras.authorKey;
  if (aKey) { try { out.author = (await getJSON(`https://openlibrary.org${aKey}.json`)).name || ''; } catch {} }
  return out;
}

const first = (...v) => v.find(x => x != null && x !== '' && !(typeof x === 'number' && isNaN(x)));
const uniq = arr => [...new Set(arr.filter(Boolean))];

function mergeResults(G, O, isbn) {
  const tG = G ? splitSeriesFromTitle(G.title, G.subtitle) : {};
  const tO = O ? splitSeriesFromTitle(O.title, O.subtitle) : {};
  const years = [G && G.year, O && O.year].filter(Boolean).sort();
  return {
    title: first(tG.title, tO.title) || '',
    author: first(G && G.author, O && O.author) || '',
    series: first(O && O.series, tG.series, tO.series) || '',
    seriesNum: first(O && O.seriesNum, tG.num, tO.num, G && G.seriesNum) ?? null,
    synopsis: first(G && G.synopsis, O && O.synopsis) || '',
    genre: guessGenre([...(G && G.categories || []), ...(O && O.subjects || []).slice(0, 40)]),
    year: years[0] || '',
    isbn: isbn || first(G && G.isbn, O && O.isbn) || '',
    coverOptions: uniq([...(O && O.covers || []), ...(G && G.covers || [])]),
    workKey: O && O.workKey,
  };
}

async function lookupIsbn(raw) {
  const n = normIsbn(raw);
  if (!n) return null;
  const isbn = isbn10to13(n);
  const [g, o] = await Promise.allSettled([googleByIsbn(isbn), olByIsbn(isbn)]);
  const G = g.status === 'fulfilled' ? g.value : null;
  const O = o.status === 'fulfilled' ? o.value : null;
  if (!G && !O) return null;
  const r = mergeResults(G, O, isbn);
  if (!r.coverOptions.length) r.coverOptions = [`https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg?default=false`];
  return r;
}

async function searchBooks(q) {
  const [g, o] = await Promise.allSettled([
    gbooks(`volumes?q=${encodeURIComponent(q)}&maxResults=15&printType=books`),
    getJSON(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=15&fields=key,title,author_name,first_publish_year,cover_i,isbn,subject`),
  ]);
  const G = g.status === 'fulfilled' ? (g.value.items || []).map(fromGoogle) : [];
  const O = o.status === 'fulfilled' ? (o.value.docs || []).map(d => ({
    source: 'ol', title: d.title || '', author: (d.author_name || []).join(', '), year: d.first_publish_year ? String(d.first_publish_year) : '',
    covers: d.cover_i ? [olCover(d.cover_i)] : [], subjects: (d.subject || []).slice(0, 40), workKey: d.key,
    // Prefer English-language ISBNs (978-0 / 978-1) so you get the edition you're likely holding.
    isbn: ((d.isbn || []).find(i => /^978[01]\d{9}$/.test(i)) || (d.isbn || []).find(i => /^97[89]\d{10}$/.test(i)) || ''),
  })) : [];
  const out = [], seen = new Map();
  const len = Math.max(G.length, O.length);
  for (let i = 0; i < len; i++) for (const c of [G[i], O[i]]) {
    if (!c || !c.title) continue;
    const k = norm(splitSeriesFromTitle(c.title).title) + '|' + norm(String(c.author).split(',')[0]);
    if (seen.has(k)) { const ex = seen.get(k); ex.covers = uniq([...ex.covers, ...c.covers]); if (!ex.isbn) ex.isbn = c.isbn; if (!ex.workKey) ex.workKey = c.workKey; continue; }
    seen.set(k, c); out.push(c);
  }
  return out;
}

async function candidateToBook(c) {
  let full = c.isbn ? await lookupIsbn(c.isbn).catch(() => null) : null;
  const base = mergeResults(c.source === 'google' ? c : null, c.source === 'ol' ? c : null, c.isbn);
  if (!full) {
    full = base;
    if (c.workKey && !full.synopsis) { const x = await olWorkExtras(c.workKey); full.synopsis = x.synopsis || ''; full.coverOptions = uniq([...full.coverOptions, ...(x.covers || [])]); }
  } else {
    // The thing you tapped wins for title/author; the ISBN lookup fills in the rest.
    full.title = base.title || full.title; full.author = base.author || full.author;
    full.coverOptions = uniq([...base.coverOptions, ...full.coverOptions]);
    if (!full.genre) full.genre = base.genre;
  }
  return full;
}

async function findOtherCovers(title, author) {
  const q = `${title} ${String(author || '').split(',')[0]}`.trim();
  const covers = [];
  const [g, o] = await Promise.allSettled([
    gbooks(`volumes?q=${encodeURIComponent(q)}&maxResults=20&printType=books`),
    getJSON(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=5&fields=key,cover_i`),
  ]);
  if (o.status === 'fulfilled') {
    const docs = o.value.docs || [];
    docs.forEach(d => d.cover_i && covers.push(olCover(d.cover_i)));
    if (docs[0] && docs[0].key) {
      try {
        const eds = await getJSON(`https://openlibrary.org${docs[0].key}/editions.json?limit=60`);
        (eds.entries || []).forEach(e => (e.covers || []).filter(c => c > 0).forEach(c => covers.push(olCover(c))));
      } catch {}
    }
  }
  if (g.status === 'fulfilled') (g.value.items || []).forEach(it => fromGoogle(it).covers.slice(0, 1).forEach(c => covers.push(c)));
  return uniq(covers).slice(0, 48);
}

// Amazon link titles often have extra words ("Iron Flame Empyrean Rebecca Yarros") that
// stop Open Library matching, so retry with fewer words if nothing comes back.
async function searchLoose(q) {
  const words = q.split(/\s+/).filter(Boolean);
  const tries = [q];
  if (words.length > 4) tries.push([...words.slice(0, 3), ...words.slice(-2)].join(' '), words.slice(0, 3).join(' '));
  for (const t of tries) {
    const list = await searchBooks(t).catch(() => []);
    if (list.length) return list;
  }
  return [];
}

function parseAmazon(url) {
  const s = String(url || '').trim();
  const m = s.match(/(?:\/dp\/|\/gp\/product\/|\/gp\/aw\/d\/|\/ASIN\/)([A-Z0-9]{10})(?:[/?#&]|$)/i) || s.match(/[?&]asin=([A-Z0-9]{10})/i);
  const asin = m ? m[1].toUpperCase() : '';
  // e.g. amazon.co.uk/Iron-Flame-Empyrean-Rebecca-Yarros-ebook/dp/… or amazon.com/-/en/Iron-Flame/dp/…
  const slugM = s.match(/amazon\.[^/]+\/(?:-\/[a-z]{2}\/)?([^/?]+)\/(?:dp|gp)\//i);
  const slug = slugM ? decodeURIComponent(slugM[1]).replace(/-/g, ' ')
    .replace(/\b(kindle edition|ebook|e book|paperback|hardcover|audible audiobook|kindle)\b/ig, '').replace(/\s+/g, ' ').trim() : '';
  const short = /(amzn\.(?:to|eu|asia)|a\.co)\//i.test(s);
  return {
    asin, slug, short,
    isbn: /^\d{9}[\dX]$/.test(asin) ? asin : null,
    isKindle: /^B0/.test(asin) || /kindle|ebook/i.test(s),
  };
}

/* ═════════════ Image upload → small JPEG stored with the book ═════════════ */
function fileToCover(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      resolve(drawToJpeg(img)); // limits width AND height, so wide screenshots stay small too
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read that image')); };
    img.src = url;
  });
}

/* ═════════════ Add book sheet: Scan / Search / Link ═════════════ */
let scanner = null;
async function loadScannerLib() {
  if (window.Html5Qrcode) return;
  await new Promise((res, rej) => { const s = document.createElement('script'); s.src = SCANNER_SRC; s.onload = res; s.onerror = () => rej(new Error('Scanner failed to load')); document.head.appendChild(s); });
}
async function stopScanner() {
  const s = scanner; scanner = null;
  if (s) { try { if (s.isScanning) await s.stop(); s.clear(); } catch {} }
}

// When adding a book from a series (e.g. tapping a missing #5), these details are filled in for you.
let addPreset = null;
function openAdd(tab = isTouch ? 'scan' : 'search', preset = null) {
  addPreset = preset;
  const body = openSheet(preset ? `Add ${preset.series} #${preset.seriesNum}` : 'Add a book', `
    ${preset ? `<div class="note" style="background:var(--card);margin:0 0 12px">Find the book any way you like; it will be added to <b>${esc(preset.series)}</b> as book <b>#${esc(preset.seriesNum)}</b>.</div>` : ''}
    <div class="seg" id="addTabs">
      <button data-t="scan">Scan</button><button data-t="search">Search</button><button data-t="link">Amazon link</button>
    </div>
    <div id="addPane" style="margin-top:14px"></div>
    <div style="text-align:center;margin-top:14px"><button class="link-btn" id="manualBtn">Add by hand instead</button></div>
  `, { onClose: () => { stopScanner(); addPreset = null; } });
  $$('#addTabs button', body).forEach(b => b.onclick = () => showTab(b.dataset.t));
  $('#manualBtn', body).onclick = () => { stopScanner(); openEdit({ isbn: '' }, { isNew: true }); };
  showTab(tab);

  async function showTab(t) {
    await stopScanner();
    $$('#addTabs button', body).forEach(b => b.classList.toggle('on', b.dataset.t === t));
    const pane = $('#addPane', body);
    if (t === 'scan') {
      pane.innerHTML = `
        <div id="reader"></div>
        <p class="scan-hint" id="scanHint">Point your camera at the barcode on the back of the book.</p>
        <form class="inline-form" id="isbnForm"><input class="inp" id="isbnIn" inputmode="numeric" placeholder="…or type the ISBN" autocomplete="off"><button class="btn">Look up</button></form>
        <div id="scanResult"></div>`;
      $('#isbnForm', pane).onsubmit = e => { e.preventDefault(); const v = $('#isbnIn', pane).value; if (normIsbn(v)) handleIsbn(v); else toast('That doesn’t look like an ISBN (10 or 13 digits)'); };
      startScanner(pane);
    } else if (t === 'search') {
      pane.innerHTML = `
        <form class="inline-form" id="searchForm" style="margin-top:0"><input class="inp" id="searchIn" type="search" placeholder="Title, author or ISBN" autocomplete="off"><button class="btn">Search</button></form>
        <div class="results" id="results"></div>`;
      const inp = $('#searchIn', pane);
      if (!isTouch) inp.focus();
      $('#searchForm', pane).onsubmit = e => { e.preventDefault(); const v = inp.value.trim(); if (!v) return; if (normIsbn(v) && /^[\d\s-xX]+$/.test(v)) handleIsbn(v); else runSearch(v, $('#results', pane)); };
    } else {
      pane.innerHTML = `
        <p style="margin:0 0 8px;color:var(--muted);font-size:.9rem">Paste a link to the book on Amazon (Kindle or paperback).</p>
        <textarea class="inp" id="linkIn" rows="3" placeholder="https://www.amazon.co.uk/…/dp/…"></textarea>
        <button class="btn block" id="linkGo" style="margin-top:8px">Find this book</button>
        <div class="results" id="results"></div>
        <div class="note" style="background:var(--card)">On a laptop? The <b>Send to My Bookshelf</b> button is quicker and more reliable, and it works on your whole Kindle Cloud Reader library. <button class="link-btn" id="toKindle">Set it up</button></div>`;
      $('#toKindle', pane).onclick = () => openKindleHelp();
      $('#linkGo', pane).onclick = () => {
        const p = parseAmazon($('#linkIn', pane).value);
        const out = $('#results', pane);

        if (p.isbn) return handleIsbn(p.isbn, defaults);
        if (p.slug) { $('#linkIn', pane).blur(); return runSearch(p.slug, out, defaults); }
        // The link only has Amazon's own code (no title), which the free book databases can't look up.
        out.innerHTML = `<div class="note">${p.short
          ? 'Short share links (like a.co/… or amzn.eu/…) don’t include the book’s name.'
          : 'This link only contains Amazon’s product code, not the book’s name, so the free book databases can’t look it up.'}
          Type the title instead and I’ll keep it marked as ${defaults.format === 'Kindle' || p.short ? 'Kindle' : 'this format'}:</div>
          <form class="inline-form" id="linkSearch"><input class="inp" id="linkQ" placeholder="Title (and author)"><button class="btn">Search</button></form>
          <div class="results" id="linkResults"></div>`;
