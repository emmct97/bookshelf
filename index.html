        $('#linkSearch', out).onsubmit = e => { e.preventDefault(); const q = $('#linkQ', out).value.trim(); if (q) runSearch(q, $('#linkResults', out), d2); };
      };
    }
  }

  async function startScanner(pane) {
    const reader = $('#reader', pane), hint = $('#scanHint', pane);
    try {
      await loadScannerLib();
      if (!$('#reader')) return; // sheet closed while loading
      const fmts = window.Html5QrcodeSupportedFormats;
      scanner = new window.Html5Qrcode('reader', { formatsToSupport: [fmts.EAN_13], experimentalFeatures: { useBarCodeDetectorIfSupported: true }, verbose: false });
      let done = false;
      await scanner.start({ facingMode: 'environment' },
        { fps: 12, qrbox: (w, h) => ({ width: Math.min(300, w * 0.85), height: Math.min(150, h * 0.45) }) },
        text => {
          if (done || !/^97[89]\d{10}$/.test(text)) return;
          done = true;
          if (navigator.vibrate) navigator.vibrate(60);
          stopScanner();
          handleIsbn(text);
        }, () => {});
    } catch (e) {
      reader.style.minHeight = '0';
      hint.innerHTML = `Couldn’t start the camera${e && e.name === 'NotAllowedError' ? ' (camera permission was blocked; allow it in your browser settings)' : ''}. You can type the ISBN below instead.`;
    }
  }

  async function runSearch(q, out, defaults = {}) {
    out.innerHTML = `<div class="status-msg"><div class="spinner"></div>Searching…</div>`;
    let list = [];
    try { list = await searchLoose(q); } catch {}
    if (!list.length) { out.innerHTML = `<div class="status-msg">No books found. Try fewer words, or <button class="link-btn" id="manual2">add it by hand</button>.</div>`; $('#manual2', out).onclick = () => openEdit({ title: q, ...defaults }, { isNew: true }); return; }
    out.innerHTML = `<p style="margin:4px 0 0;color:var(--muted);font-size:.85rem">Tap the right one. You can check and edit everything next.</p>` + list.map((c, i) => `
      <button class="row" data-i="${i}">
        ${coverHTML({ title: c.title, author: c.author, cover: c.covers[0] }, { badges: false })}
        <div class="meta"><div class="t">${esc(c.title)}</div><div class="a">${esc(c.author)}</div><div class="s">${esc(c.year || '')}</div></div>
      </button>`).join('');
    $$('[data-i]', out).forEach(btn => btn.onclick = async () => {
      out.innerHTML = `<div class="status-msg"><div class="spinner"></div>Getting the details…</div>`;
      const b = await candidateToBook(list[+btn.dataset.i]);
      openEdit({ ...b, ...defaults }, { isNew: true });
    });
  }

  async function handleIsbn(raw, defaults = {}) {
    const out = $('#scanResult') || $('#results');
    if (out) out.innerHTML = `<div class="status-msg"><div class="spinner"></div>Looking up ${esc(raw)}…</div>`;
    const r = await lookupIsbn(raw).catch(() => null);
    const isbn = isbn10to13(normIsbn(raw));
    if (!r) {
      toast('Couldn’t find that ISBN, so you can fill it in yourself', 3500);
      return openEdit({ isbn, ...defaults }, { isNew: true });
    }
    openEdit({ ...r, ...defaults }, { isNew: true });
  }
}

function findDuplicate(b) {
  return state.books.find(x => x.id !== b.id && (
    (b.isbn && x.isbn && x.isbn === b.isbn) ||
    (b.title && norm(x.title) === norm(b.title) && norm(String(x.author).split(',')[0]) === norm(String(b.author).split(',')[0]))
  ));
}

      <label class="f">Author<input name="author" value="${esc(b.author)}"></label>

        <label class="f">Series<span class="combo"><input name="series" value="${esc(b.series)}" placeholder="Pick or type" autocomplete="off"><button type="button" class="combo-btn" id="seriesOpen" aria-label="Choose a series from my shelf">▾</button></span></label>
        <label class="f">Book #<input name="seriesNum" value="${esc(b.seriesNum)}" inputmode="decimal"></label>

      <div id="seriesHints"></div>
      <label class="f">Format</label>
      <div class="seg" data-field="format">${['Physical', 'Kindle', 'Both'].map(v => `<button type="button" data-v="${v}" class="${b.format === v ? 'on' : ''}">${v}</button>`).join('')}</div>
      <label class="f">Status</label>
      <div class="seg status" data-field="status">${['Unread', 'Reading', 'Read'].map(v => `<button type="button" data-v="${v}" class="${b.status === v ? 'on' : ''}">${v}</button>`).join('')}</div>
      <label class="f">Genres <span style="font-weight:400">(tap all that fit)</span></label>
      <input type="hidden" name="genre" value="${esc(b.genre)}">
      <div class="pills gpick" id="genrePick"></div>
      <div class="inline-form hidden" id="genreNewRow" style="margin-top:6px"><input class="inp" id="genreNew" placeholder="New genre, e.g. Cosy Fantasy"><button class="btn" type="button" id="genreAdd">Add</button></div>
      <label class="f" style="max-width:50%">Year<input name="year" value="${esc(b.year)}" inputmode="numeric"></label>
      <label class="f">ISBN<input name="isbn" value="${esc(b.isbn)}" inputmode="numeric"></label>
      <label class="f">Synopsis (spoiler-free; trim anything that gives too much away)<textarea name="synopsis">${esc(b.synopsis)}</textarea></label>
      <div class="save-bar"><button class="btn ghost" type="button" data-close>Cancel</button><button class="btn" type="submit">${isNew ? 'Add to my shelf' : 'Save changes'}</button></div>
    </form>
  `);

  const form = $('#editForm', body);
  const updatePreview = () => { $('#coverPrev', body).innerHTML = coverHTML({ ...b, title: form.title.value, author: form.author.value }, { badges: false }); };
  $$('.seg[data-field]', body).forEach(seg => seg.addEventListener('click', e => {
    const btn = e.target.closest('button'); if (!btn) return;
    b[seg.dataset.field] = btn.dataset.v;
    $$('button', seg).forEach(x => x.classList.toggle('on', x === btn));
  }));
  if (dup) $('#openDup', body).onclick = () => openDetail(dup.id);

  const picker = $('#coverPicker', body);
  function showCoverGrid(list) {
    if (!list.length) { picker.innerHTML = `<p class="status-msg">No other covers found. Try uploading a photo.</p>`; return; }
    picker.innerHTML = `<div class="cover-grid">${list.map(u => `<button type="button" data-u="${esc(u)}" class="${u === b.cover ? 'on' : ''}"><img src="${esc(u)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentElement.remove()" alt=""></button>`).join('')}</div>`;
    $$('[data-u]', picker).forEach(btn => btn.onclick = () => {
      b.cover = btn.dataset.u; updatePreview();
      $$('[data-u]', picker).forEach(x => x.classList.toggle('on', x === btn));
    });
  }
  $('#moreCovers', body).onclick = async () => {
    picker.innerHTML = `<div class="status-msg"><div class="spinner"></div>Finding covers…</div>`;
    const found = await findOtherCovers(form.title.value, form.author.value).catch(() => []);
    coverOptions = uniq([...coverOptions, ...found]);
    showCoverGrid(coverOptions);
  };
  $('#coverFile', body).onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { b.cover = await fileToCover(f); updatePreview(); picker.innerHTML = ''; toast('Cover updated'); }
    catch (err) { toast(err.message); }
  };
  $('#coverUrl', body).onclick = () => {
    picker.innerHTML = `<div class="inline-form"><input class="inp" id="urlIn" placeholder="https://…jpg"><button class="btn" type="button" id="urlOk">Use</button></div>`;
    $('#urlOk', picker).onclick = () => { const u = $('#urlIn', picker).value.trim(); if (/^https?:\/\//.test(u)) { b.cover = u; updatePreview(); picker.innerHTML = ''; } else toast('Paste a link starting with https://'); };
  };
  form.title.addEventListener('input', updatePreview);

  // One-tap series suggestions: series by the same author already on your shelf.
  function seriesHints() {
    const box = $('#seriesHints', body);
    const a = norm(String(form.author.value).split(',')[0]);
    const groups = [...seriesGroups(state.books).values()].filter(g => a && g.books.some(x => x.id !== b.id && norm(String(x.author).split(',')[0]) === a));
    const needsNum = form.series.value && !form.seriesNum.value;
    const cur = groups.find(g => seriesKey(g.name) === seriesKey(form.series.value));
    let html = '';
    if (!form.series.value && groups.length) {
      html = `<div class="pills" style="margin-top:6px">${groups.map(g => `<button type="button" class="pill" data-s="${esc(g.name)}" style="border:0">+ ${esc(g.name)}</button>`).join('')}</div>`;
    } else if (needsNum && cur) {
      const owned = new Set(cur.books.filter(x => x.id !== b.id).map(x => Math.floor(Number(x.seriesNum))));
      const end = cur.total || Math.max(0, ...[...owned].filter(n => !isNaN(n))) + 1;
      const nums = []; for (let n = 1; n <= end; n++) if (!owned.has(n)) nums.push(n);
      html = `<div class="pills" style="margin-top:6px"><span class="pill" style="background:none">Book #?</span>${nums.map(n => `<button type="button" class="pill" data-n="${n}" style="border:0">${n}</button>`).join('')}</div>`;
    }
    box.innerHTML = html;
    $$('[data-s]', box).forEach(x => x.onclick = () => {
      form.series.value = x.dataset.s;
      const g = groups.find(g => g.name === x.dataset.s);
      if (g && g.total && !form.seriesTotal.value) form.seriesTotal.value = g.total;
      seriesHints();
    });
    $$('[data-n]', box).forEach(x => x.onclick = () => { form.seriesNum.value = x.dataset.n; seriesHints(); });
  }
  ['series', 'seriesNum', 'author'].forEach(n => form[n].addEventListener('input', seriesHints));
  seriesHints();

  // Series picker: a tappable list of the series already on your shelf.
  const pick = $('#seriesPick', body);
  function showSeriesPick(all = false) {
    const groups = [...seriesGroups(state.books).values()].sort((x, y) => sortTitle(x.name).localeCompare(sortTitle(y.name)));
    const q = all ? '' : norm(form.series.value);
    const list = groups.filter(g => !q || norm(g.name).includes(q) || norm(g.books[0].author).includes(q));
    if (!groups.length) { pick.innerHTML = `<div class="pick-empty">No series on your shelf yet. Just type the name.</div>`; pick.classList.remove('hidden'); return; }
    if (!list.length || (list.length === 1 && seriesKey(list[0].name) === seriesKey(form.series.value) && !all)) { pick.classList.add('hidden'); return; }
    pick.innerHTML = list.map(g => `<button type="button" data-name="${esc(g.name)}">
      <b>${esc(g.name)}</b><span>${esc(g.books[0].author || '')} · ${g.books.length} owned${g.total ? ` of ${g.total}` : ''}</span></button>`).join('')
      + (form.series.value ? `<button type="button" data-clear><span>✕ Not part of a series</span></button>` : '');
    pick.classList.remove('hidden');
    $$('[data-name]', pick).forEach(x => x.onclick = () => {
      const g = groups.find(g => g.name === x.dataset.name);
      form.series.value = g.name;
      if (!form.seriesTotal.value && g.total) form.seriesTotal.value = g.total;
      if (!form.author.value && g.books[0].author) { form.author.value = g.books[0].author; updatePreview(); }
      pick.classList.add('hidden');
      seriesHints();
    });
    const clr = $('[data-clear]', pick);
    if (clr) clr.onclick = () => { form.series.value = ''; form.seriesNum.value = ''; form.seriesTotal.value = ''; pick.classList.add('hidden'); seriesHints(); };
  }
  $('#seriesOpen', body).onclick = e => { e.preventDefault(); pick.classList.contains('hidden') ? showSeriesPick(true) : pick.classList.add('hidden'); };
  form.series.addEventListener('input', () => showSeriesPick(false));
  form.series.addEventListener('focus', () => { if (!form.series.value) showSeriesPick(true); });
  body.addEventListener('click', e => { if (!e.target.closest('#seriesPick, .combo')) pick.classList.add('hidden'); });

  // Genre picker: tap as many as fit.
  let chosen = splitGenres(b.genre);
  genres = uniq([...chosen, ...genres]);
  function drawGenres() {
    form.genre.value = chosen.join(', ');
    $('#genrePick', body).innerHTML = genres.map(g => `<button type="button" class="pill ${chosen.includes(g) ? 'on' : ''}" data-g="${esc(g)}">${chosen.includes(g) ? '✓ ' : ''}${esc(g)}</button>`).join('')
      + `<button type="button" class="pill add" id="genreMore">+ New genre</button>`;
    $$('[data-g]', body).forEach(x => x.onclick = () => {
      const g = x.dataset.g;
      chosen = chosen.includes(g) ? chosen.filter(c => c !== g) : [...chosen, g];
      drawGenres();
    });
    $('#genreMore', body).onclick = () => { $('#genreNewRow', body).classList.remove('hidden'); $('#genreNew', body).focus(); };
  }
  const addGenre = () => {
    const v = $('#genreNew', body).value.trim().replace(/,/g, ' ');
    if (!v) return;
    const existing = genres.find(g => norm(g) === norm(v));
    const g = existing || v;
    if (!existing) genres = [g, ...genres];
    if (!chosen.includes(g)) chosen.push(g);
    rememberGenre(g); // saved to your genre list straight away, for every book
    $('#genreNew', body).value = '';
    $('#genreNewRow', body).classList.add('hidden');
    drawGenres();
  };
  $('#genreAdd', body).onclick = addGenre;
  $('#genreNew', body).addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addGenre(); } });
  drawGenres();

  form.onsubmit = e => {
    e.preventDefault();
    if ($('#genreNew', body).value.trim()) addGenre(); // typed a new genre but didn't tap Add
    const fd = new FormData(form);
    const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
    const book = {
      ...b,
      title: fd.get('title').trim(), author: fd.get('author').trim(), series: fd.get('series').trim(),
      seriesNum: num(fd.get('seriesNum')), seriesTotal: num(fd.get('seriesTotal')),
      genre: fd.get('genre').trim(), year: fd.get('year').trim(), isbn: fd.get('isbn').replace(/[^0-9Xx]/g, ''),
      synopsis: fd.get('synopsis').trim(), updatedAt: Date.now(),
    };
    if (!book.title) return toast('Give it a title first');
    store.save(book);
    // Keep the series total in sync across the series.
    if (book.series && book.seriesTotal) state.books
      .filter(x => x.id !== book.id && seriesKey(x.series) === seriesKey(book.series) && x.seriesTotal !== book.seriesTotal)
      .forEach(x => store.save({ ...x, seriesTotal: book.seriesTotal, updatedAt: Date.now() }));
    closeSheet();
    toast(isNew ? `Added “${book.title}” to your shelf` : 'Saved');
  };
}

/* ═════════════ Pick from my TBR ═════════════ */
function openTBR() {
  const pool = state.books.filter(b => (b.status || 'Unread') === 'Unread');
  if (!pool.length) return toast(state.books.length ? 'No unread books. You’ve read everything you own!' : 'Add some books first');
  const body = openSheet('Pick from my TBR', `<div class="tbr-stage"><div id="tbrCover" style="width:170px"></div><h3 id="tbrT"></h3><div class="by" id="tbrA" style="color:var(--muted)"></div><div id="tbrS" style="font-style:italic;font-size:.9rem;margin-top:2px"></div></div>
    <div class="detail-actions" id="tbrActs" style="visibility:hidden">
      <button class="btn wide" id="tbrStart">Start reading</button>
      <button class="btn ghost" id="tbrAgain">Pick again</button>
      <button class="btn ghost" id="tbrOpen">Open book</button>
    </div>`);
  let chosen, timer;
  const show = b => {
    $('#tbrCover', body).innerHTML = coverHTML(b, { badges: false });
    $('#tbrT', body).textContent = b.title; $('#tbrA', body).textContent = b.author; $('#tbrS', body).textContent = seriesLabel(b);
  };
  function spin() {
    clearInterval(timer);
    $('#tbrActs', body).style.visibility = 'hidden';
    chosen = pool[Math.floor(Math.random() * pool.length)];
    if (pool.length === 1) { show(chosen); $('#tbrActs', body).style.visibility = 'visible'; return; }
    let i = 0; const steps = 14;
    timer = setInterval(() => {
      show(i < steps ? pool[Math.floor(Math.random() * pool.length)] : chosen);
      $('#tbrCover .cover', body).classList.toggle('spin', i < steps);
      if (i++ >= steps) { clearInterval(timer); $('#tbrActs', body).style.visibility = 'visible'; }
    }, 70 + i * 4);
  }
  $('#tbrAgain', body).onclick = spin;
  $('#tbrOpen', body).onclick = () => openDetail(chosen.id);
  $('#tbrStart', body).onclick = () => { store.save({ ...chosen, status: 'Reading', updatedAt: Date.now() }); closeSheet(); toast(`Enjoy “${chosen.title}”!`); };
  spin();
}

/* ═════════════ Kindle Cloud Reader & Amazon: "Send to My Bookshelf" button ═════════════ */
// This function becomes a bookmark (a "bookmarklet"). It runs on Amazon's page in YOUR
// browser, reads the book details you can already see, and opens your bookshelf with them.
// Nothing is sent anywhere else.
function sendToBookshelf(APP) {
  if (!/(^|\.)amazon\./.test(location.hostname)) { alert('Open Kindle Cloud Reader (read.amazon…) or an Amazon book page, then click this bookmark.'); return; }
  const win = window.open('about:blank', '_blank');
  const go = items => {
    const url = APP + '#kindle=' + encodeURIComponent(JSON.stringify(items));
    if (win) win.location.href = url; else location.href = url;
  };
  const big = u => String(u || '').replace(/\._[^/]*?_\.(jpe?g|png)/i, '.$1');
  const q = s => document.querySelector(s);
  const fail = msg => { if (win) win.close(); alert(msg); };

  // Kindle Cloud Reader (read.amazon.com / .co.uk / …): your whole Kindle library.
  if (/^read\.amazon\./.test(location.hostname)) {
    (async () => {
      const items = [];
      let token = '';
      for (let page = 0; page < 60; page++) {
        let j = null;
        try {
          const r = await fetch('/kindle-library/search?query=&libraryType=BOOKS&sortType=recency&querySize=50' + (token ? '&paginationToken=' + encodeURIComponent(token) : ''), { credentials: 'include' });
          if (r.ok) j = await r.json();
        } catch (e) {}
        if (!j) break;
        (j.itemsList || []).forEach(it => items.push({ a: it.asin, t: it.title, w: it.authors || [], c: big(it.productUrl) }));
        token = j.paginationToken;
        if (!token) break;
      }
      if (!items.length) { // fallback: read the covers visible on the library page
        document.querySelectorAll('img[id^="cover-"], [id^="cover-"] img').forEach(img => {
          const holder = img.id && img.id.indexOf('cover-') === 0 ? img : img.closest('[id^="cover-"]');
          const asin = holder.id.replace(/^cover-/, '');
          const t = document.getElementById('title-' + asin), w = document.getElementById('author-' + asin);
          items.push({ a: asin, t: (t ? t.innerText : img.alt || '').trim(), w: [(w ? w.innerText : '').trim()], c: big(img.src) });
        });
      }
      const one = new URLSearchParams(location.search).get('asin');
      const pick = one ? items.filter(i => i.a === one) : [];
      if (pick.length) go(pick.map(i => Object.assign(i, { one: 1 })));
      else if (items.length) go(items.filter(i => i.t));
      else fail('I couldn’t find your Kindle books on this page. Go to your Library in Kindle Cloud Reader, scroll so the covers show, and try again.');
    })();
    return;
  }

  // Any Amazon book page (Kindle or physical): just this book.
  const dt = document.title || '';
  let title = (q('#productTitle') || q('#ebooksProductTitle') || {}).textContent || '';
  if (!title.trim()) title = dt.split(/ eBook ?:| : | \| /)[0];
  const authors = Array.from(document.querySelectorAll('#bylineInfo .author a, #bylineInfo a.contributorNameID'))
    .map(a => a.textContent.trim()).filter(x => x && !/visit|learn more|search|follow|see all/i.test(x));
  let author = authors[0] || '';
  if (!author) { const parts = dt.split(' : '); if (parts.length > 2) author = parts[1]; }
  const img = q('#ebooksImgBlkFront') || q('#imgBlkFront') || q('#landingImage') || q('#main-image');
  let cover = '';
  if (img) {
    try { cover = Object.keys(JSON.parse(img.getAttribute('data-a-dynamic-image') || '{}'))[0] || ''; } catch (e) {}
    cover = img.getAttribute('data-old-hires') || cover || img.src;
  }
  const text = document.body.innerText;
  const i13 = text.match(/ISBN-13\s*[:‎‏\s]*([\d-]{13,17})/), i10 = text.match(/ISBN-10\s*[:‎‏\s]*([\dX]{10})/);
  const seriesEl = q('#seriesBulletWidget_feature_div') || q('#rpi-attribute-book_details-series') || q('#seriesTitle_feature_div');
  const asinM = location.pathname.match(/\/(?:dp|gp\/product)\/([A-Z0-9]{10})/i);
  const kindle = /ebook|kindle/i.test(dt + location.href) || !!q('#ebooksImgBlkFront') || !!q('#ebooksProductTitle');
  if (!title.trim()) return fail('This doesn’t look like an Amazon book page.');
  go([{ one: 1, a: asinM ? asinM[1] : '', t: title.trim(), w: [author], c: big(cover),
        i: (i13 ? i13[1] : i10 ? i10[1] : '').replace(/-/g, ''), s: seriesEl ? seriesEl.innerText.trim() : '', k: kindle ? 1 : 0 }]);
}

function bookmarkletHref() {
  const app = location.origin + location.pathname.replace(/index\.html$/, '');
  return 'javascript:' + encodeURIComponent(`(${sendToBookshelf.toString()})(${JSON.stringify(app)})`);
}

// ── Receiving books from the button ──
const amzAuthor = w => (Array.isArray(w) ? w : [w]).map(a => String(a || '').replace(/[:;]+\s*$/, '').trim())
  .filter(Boolean).map(a => { const p = a.split(','); return p.length === 2 ? `${p[1].trim()} ${p[0].trim()}` : a; }).join(', ');

function fromAmazonItem(it) {
  const raw = String(it.t || '').replace(/\s*\((?:English Edition|Kindle Edition)\)\s*/ig, ' ')
    .replace(/\s*[:\-–]\s*(?:a|the)\s+novel\s*$/i, '').replace(/\s*[:\-–]\s*a\s+novel(?=\s*\()/i, '').trim();
  const tp = splitSeriesFromTitle(raw);
  let series = tp.series, num = tp.num, total = '';
  const sm = String(it.s || '').match(/book\s*(\d+(?:\.\d+)?)\s*of\s*(\d+)\s*[:\-–]?\s*(.*)$/i);
  if (sm) { if (num == null) num = Number(sm[1]); total = Number(sm[2]); if (!series) series = tidySeries(sm[3]); }
  return {
    title: tp.title, author: amzAuthor(it.w), series, seriesNum: num ?? '', seriesTotal: total,
    cover: it.c || '', coverOptions: it.c ? [it.c] : [], isbn: it.i ? isbn10to13(normIsbn(it.i)) || '' : '',
    asin: it.a || '', format: it.k === 0 ? 'Physical' : 'Kindle',
  };
}

function findOwned(d) {
  const a = norm(String(d.author).split(',')[0]);
  return state.books.find(x =>
    (d.asin && x.asin === d.asin) || (d.isbn && x.isbn === d.isbn) ||
    (norm(x.title) === norm(d.title) && (!a || norm(String(x.author).split(',')[0]) === a)));
}

// Fill blanks (synopsis, genre, year, series…) from Google Books / Open Library.
async function enrichDraft(d) {
  let found = null;
  if (d.isbn) found = await lookupIsbn(d.isbn).catch(() => null);
  if (!found && d.title) {
    const list = await searchLoose(`${d.title} ${String(d.author).split(',')[0]}`).catch(() => []);
    const want = norm(d.title);
    const c = list.find(c => { const t = norm(splitSeriesFromTitle(c.title).title); return t && (t.startsWith(want) || want.startsWith(t)); });
    if (c) found = await candidateToBook(c).catch(() => null);
  }
  if (!found) return { ...d, _found: false };
  const out = { ...d, _found: true };
  const fill = ['synopsis', 'genre', 'year', 'series', 'seriesNum', 'author'];
  if (d.format !== 'Kindle') fill.push('isbn');
  for (const k of fill) if ((out[k] == null || out[k] === '') && found[k] != null && found[k] !== '') out[k] = found[k];
  out.coverOptions = uniq([...(d.coverOptions || []), ...(found.coverOptions || [])]);
  if (!out.cover) out.cover = out.coverOptions[0] || '';
  return out;
}

let incoming = null;
try {
  const m = location.hash.match(/^#kindle=(.+)$/s);
  if (m) {
    history.replaceState(null, '', location.pathname + location.search);
    incoming = JSON.parse(decodeURIComponent(m[1]));
  }
} catch { setTimeout(() => toast('Couldn’t read the books sent from Amazon. Try the button again.'), 500); }

async function handleIncoming(items) {
  if (!Array.isArray(items) || !items.length) return;
  if (items.length === 1 && items[0].one) {
    const d = fromAmazonItem(items[0]);
    openSheet('Adding from Amazon', `<div class="status-msg"><div class="spinner"></div>Getting the details for “${esc(d.title)}”…</div>`);
    const full = await enrichDraft(d);
    delete full._found;
    return openEdit(full, { isNew: true });
  }
  openKindleImport(items.map(fromAmazonItem));
}

function openKindleImport(drafts) {
  const rows = drafts.map((d, i) => ({ d, i, owned: findOwned(d) }));
  const newCount = rows.filter(r => !r.owned).length;
  const body = openSheet('Import from Kindle', `
    <p style="margin:0 0 8px">Found <b>${drafts.length}</b> books in your Kindle library${newCount < drafts.length ? `. <b>${drafts.length - newCount}</b> ${drafts.length - newCount === 1 ? 'is' : 'are'} already on your shelf` : ''}. Tick the ones you want on your shelf.</p>
    <div class="inline-form" style="margin:0 0 6px"><input class="inp" id="kSearch" type="search" placeholder="Filter this list"></div>
    <div style="display:flex;gap:14px;margin-bottom:6px"><button class="link-btn" id="kAll">Tick all new</button><button class="link-btn" id="kNone">Untick all</button></div>
    <div class="list" id="kList" style="grid-template-columns:1fr">${rows.map(({ d, i, owned }) => {
      const both = owned && owned.format === 'Physical';
      const done = owned && !both;
      return `<label class="row" data-k="${i}" style="cursor:pointer;${done ? 'opacity:.55' : ''}">
        <input type="checkbox" data-i="${i}" ${owned ? '' : 'checked'} ${done ? 'disabled' : ''} style="width:20px;height:20px;flex:none;accent-color:var(--accent)">
        ${coverHTML({ title: d.title, author: d.author, cover: d.cover }, { badges: false })}
        <div class="meta"><div class="t">${esc(d.title)}</div><div class="a">${esc(d.author)}</div>
          ${d.series ? `<div class="s">${esc(seriesLabel(d))}</div>` : ''}
          ${done ? `<div class="pills"><span class="pill">Already on your shelf</span></div>` : both ? `<div class="pills"><span class="pill kindle">You own the paperback; tick to mark it as Both</span></div>` : ''}
        </div></label>`;
    }).join('')}</div>
    <div class="save-bar"><button class="btn" id="kGo" style="flex:1"></button></div>
  `);
  const boxes = $$('input[data-i]', body);
  const update = () => { const n = boxes.filter(b => b.checked).length; $('#kGo', body).textContent = n ? `Add ${n} book${n === 1 ? '' : 's'}` : 'Nothing ticked'; $('#kGo', body).disabled = !n; };
  boxes.forEach(b => b.onchange = update);
  $('#kAll', body).onclick = () => { boxes.forEach(b => { if (!b.disabled) b.checked = !rows[+b.dataset.i].owned; }); update(); };
  $('#kNone', body).onclick = () => { boxes.forEach(b => b.checked = false); update(); };
  $('#kSearch', body).oninput = e => { const q = norm(e.target.value); $$('[data-k]', body).forEach(r => { const d = drafts[+r.dataset.k]; r.style.display = !q || norm(`${d.title} ${d.author} ${d.series}`).includes(q) ? '' : 'none'; }); };
  update();
  $('#kGo', body).onclick = () => {
    const now = Date.now();
    let added = 0, merged = 0;
    boxes.filter(b => b.checked).forEach((b, n) => {
      const { d, owned } = rows[+b.dataset.i];
      if (owned) { store.save({ ...owned, format: 'Both', asin: owned.asin || d.asin, updatedAt: now }); merged++; return; }
      const { coverOptions, ...rest } = d;
      store.save({
        ...rest, id: uid(), status: 'Unread', synopsis: '', genre: '', year: '',
        seriesNum: d.seriesNum === '' ? null : d.seriesNum, seriesTotal: d.seriesTotal === '' ? null : d.seriesTotal,
        addedAt: now - n, updatedAt: now, needsDetails: true,
      });
      added++;
    });
    closeSheet();
    toast(`Added ${added} Kindle book${added === 1 ? '' : 's'}${merged ? `, marked ${merged} as Both` : ''}. Filling in details…`, 3500);
    setTimeout(fillMissingDetails, 800);
  };
}

// Background job: looks up synopsis/genre/year for imported books, one at a time.
let filling = false;
async function fillMissingDetails() {
  if (filling) return;
  filling = true;
  try {
    for (;;) {
      const todo = state.books.filter(b => b.needsDetails);
      if (!todo.length) break;
      const b = todo[0];
      $('#stats').textContent = `Filling in details for ${todo.length} Kindle book${todo.length === 1 ? '' : 's'}…`;
      const full = await enrichDraft(b).catch(() => ({ ...b, _found: false }));
      const { _found, coverOptions, needsDetails, ...clean } = full;
      // Don't overwrite anything you've edited since the import.
      const latest = state.books.find(x => x.id === b.id) || b;
      const merged = { ...clean, ...Object.fromEntries(Object.entries(latest).filter(([k, v]) => v !== '' && v != null && k !== 'needsDetails')) };
      delete merged.needsDetails;
      merged.updatedAt = Date.now();
      store.save(merged);
      // Saves are optimistic; wait for this book to drop off the to-do list.
      for (let t = 0; t < 50 && state.books.find(x => x.id === b.id && x.needsDetails); t++) await new Promise(r => setTimeout(r, 100));
      if (state.books.find(x => x.id === b.id && x.needsDetails)) break; // offline or failing; try again next time
      await new Promise(r => setTimeout(r, 400));
    }
  } finally { filling = false; render(); }
}

/* ═════════════ Menu: backup, display mode, theme, sign out ═════════════ */
function openMenu() {
  const theme = lsGet('bookshelf.theme', 'auto');
  const body = openSheet('Menu', `
    <div class="menu-list">
      <button class="btn ghost" id="mKindle">📥 Add from Kindle Cloud Reader / Amazon</button>
      <button class="btn ghost" id="mGenres">🏷️ My genres (add, rename, remove)</button>
      <button class="btn ghost" id="mDisplay">📸 Display mode (hide buttons for photos)</button>
      <button class="btn ghost" id="mExport">⬇️ Download a backup of my books</button>
      <label class="btn ghost">⬆️ Restore from a backup file<input type="file" accept="application/json,.json" id="mImport" hidden></label>
      <div style="margin-top:6px"><label class="f" style="margin:0 0 6px">Appearance</label>
        <div class="seg" id="mTheme">${[['auto', 'Match phone'], ['light', 'Light'], ['dark', 'Dark']].map(([v, l]) => `<button data-v="${v}" class="${theme === v ? 'on' : ''}">${l}</button>`).join('')}</div>
      </div>
      ${hasFirebase ? `<button class="btn ghost" id="mFix">🔧 Fix syncing on this device</button>
      <button class="btn ghost" id="mOut" style="margin-top:6px">Sign out</button>` : ''}
      <p style="color:var(--muted);font-size:.82rem;text-align:center;margin:8px 0 0">${hasFirebase ? 'Syncing between your devices.' : 'Saving on this device only. See SETUP.md to turn on syncing.'}</p>
    </div>`);
  $('#mDisplay', body).onclick = () => { closeSheet(); setDisplayMode(true); };
  $('#mKindle', body).onclick = () => openKindleHelp();
  $('#mGenres', body).onclick = () => openGenreManager();
  $('#mExport', body).onclick = () => {
    const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), books: state.books, settings: state.meta }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `my-bookshelf-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  $('#mImport', body).onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      const books = Array.isArray(data) ? data : data.books;
      if (!Array.isArray(books)) throw new Error();
      if (!confirm(`Restore ${books.length} books? Books with the same ID will be overwritten; nothing else is deleted.`)) return;
      books.forEach(b => b && b.id && b.id !== SETTINGS_ID && b.title && store.save(b));
      if (data.settings && Array.isArray(data.settings.genres)) saveGenreList([...savedGenres(), ...data.settings.genres]);
      closeSheet(); toast(`Restored ${books.length} books`);
    } catch { toast('That file isn’t a bookshelf backup'); }
  };
  $$('#mTheme button', body).forEach(btn => btn.onclick = () => {
    lsSet('bookshelf.theme', btn.dataset.v); applyTheme();
    $$('#mTheme button', body).forEach(x => x.classList.toggle('on', x === btn));
  });
  if ($('#mOut', body)) $('#mOut', body).onclick = () => { closeSheet(); store.signOut(); };
  if ($('#mFix', body)) $('#mFix', body).onclick = () => {
    if (confirm('This refreshes this device’s copy of your library from Firebase and restarts the app. Your books are safe and nothing is deleted from Firebase. Continue?')) store.fixStorage({ code: 'unavailable' }, true);
  };
}
/* ═════════════ My genres: add, rename, remove (applies to every book) ═════════════ */
function openGenreManager() {
  const body = openSheet('My genres', `
    <p style="margin:0 0 10px;color:var(--muted);font-size:.9rem">These are offered whenever you add or edit a book, on all your devices. Renaming or removing one updates every book that uses it.</p>
    <form class="inline-form" id="gmAdd" style="margin:0 0 12px"><input class="inp" id="gmNew" placeholder="New genre, e.g. Dark Academia"><button class="btn">Add</button></form>
    <div class="menu-list" id="gmList"></div>`);
  const usage = g => state.books.filter(b => splitGenres(b.genre).includes(g));
  // Change one genre on every book that has it (rename, or remove when `to` is empty).
  const retag = (from, to) => usage(from).forEach(b => {
    const gs = uniq(splitGenres(b.genre).map(x => x === from ? to : x).filter(Boolean));
    store.save({ ...b, genre: gs.join(', '), updatedAt: Date.now() });
  });
  function draw() {
    $('#gmList', body).innerHTML = allGenres().map(g => {
      const n = usage(g).length;
      return `<div class="row" style="padding:8px 12px">
        <div class="meta"><div class="t" style="font-size:.98rem">${esc(g)}</div><div class="s" style="font-style:normal">${n ? `${n} book${n === 1 ? '' : 's'}` : 'Not used yet'}</div></div>
        <button class="icon-btn" data-ren="${esc(g)}" aria-label="Rename ${esc(g)}">✎</button>
        <button class="icon-btn" data-del="${esc(g)}" aria-label="Remove ${esc(g)}">✕</button>
      </div>`;
    }).join('');
    $$('[data-ren]', body).forEach(x => x.onclick = () => {
      const from = x.dataset.ren;
      const to = (prompt(`Rename “${from}” to:`, from) || '').trim().replace(/,/g, ' ');
      if (!to || to === from) return;
      const existing = allGenres().find(g => norm(g) === norm(to) && g !== from);
      retag(from, existing || to);
      saveGenreList([...savedGenres().filter(g => g !== from), existing || to]);
      toast(existing ? `Merged into “${existing}”` : 'Renamed');
      setTimeout(draw, 150);
    });
    $$('[data-del]', body).forEach(x => x.onclick = () => {
      const g = x.dataset.del, n = usage(g).length;
      if (!confirm(n ? `Remove “${g}”? It will also be taken off ${n} book${n === 1 ? '' : 's'}.` : `Remove “${g}” from your list?`)) return;
      retag(g, '');
      saveGenreList(savedGenres().filter(x => x !== g));
      setTimeout(draw, 150);
    });
  }
  $('#gmAdd', body).onsubmit = e => {
    e.preventDefault();
    const v = $('#gmNew', body).value.trim().replace(/,/g, ' ');
    if (!v) return;
    if (allGenres().some(g => norm(g) === norm(v))) { toast('That genre is already in your list'); return; }
    saveGenreList([...savedGenres(), v]);
    $('#gmNew', body).value = '';
    setTimeout(draw, 150);
  };
  draw();
}

function applyTheme() {
  const t = lsGet('bookshelf.theme', 'auto');
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}
function setDisplayMode(on) {
  document.body.classList.toggle('display-mode', on);
  $$('.exit-display').forEach(x => x.remove());
  if (on) {
    const x = document.createElement('button');
    x.className = 'icon-btn exit-display'; x.textContent = 'Done'; x.onclick = () => setDisplayMode(false);
    document.body.appendChild(x);
    toast('Tap “Done” (top right) to exit', 2000);
  }
}

/* ═════════════ Sign-in screen (only when syncing is set up) ═════════════ */
function showLogin(fs) {
  const root = $('#loginRoot');
  root.innerHTML = `<div class="login"><form class="login-card" id="loginForm">
    <div class="mini-shelf">${['#9c4a2f', '#c08a2e', '#4f7a4a', '#2f4f6e', '#7a4f2e', '#b0654a'].map((c, i) => `<i style="background:${c};height:${44 + (i * 7) % 22}px"></i>`).join('')}</div>
    <h1>My Bookshelf</h1>
    <p>Sign in to see your books.</p>
    <input class="inp" type="email" name="email" placeholder="Email" autocomplete="username" required>
    <input class="inp" type="password" name="password" placeholder="Password" autocomplete="current-password" required minlength="6">
    <button class="btn block" type="submit">Sign in</button>
    <div id="loginErr" class="note bad hidden"></div>
    <div style="display:flex;justify-content:space-between;margin-top:10px">
      <button class="link-btn" type="button" id="signUp">First time? Create account</button>
      <button class="link-btn" type="button" id="forgot">Forgot password</button>
    </div>
  </form></div>`;
  const form = $('#loginForm', root), err = $('#loginErr', root);
  const msg = e => ({
    'auth/invalid-credential': 'That email and password don’t match.',
    'auth/wrong-password': 'That email and password don’t match.',
    'auth/user-not-found': 'No account with that email yet. Tap “Create account”.',
    'auth/email-already-in-use': 'There’s already an account with that email. Just sign in.',
    'auth/weak-password': 'Password needs at least 6 characters.',
    'auth/operation-not-allowed': 'Email sign-in isn’t switched on in Firebase yet (SETUP.md, Part 2).',
    'auth/configuration-not-found': 'Email sign-in isn’t switched on in Firebase yet (SETUP.md, Part 2).',
    'auth/too-many-requests': 'Too many tries. Wait a minute and try again.',
  }[e.code] || e.message);
  const fail = e => { err.textContent = msg(e); err.classList.remove('hidden'); };
  form.onsubmit = e => { e.preventDefault(); err.classList.add('hidden'); fs.A.signInWithEmailAndPassword(fs.auth, form.email.value.trim(), form.password.value).catch(fail); };
  $('#signUp', root).onclick = () => { if (!form.reportValidity()) return; fs.A.createUserWithEmailAndPassword(fs.auth, form.email.value.trim(), form.password.value).catch(fail); };
  $('#forgot', root).onclick = () => {
    if (!form.email.value) { fail({ message: 'Type your email above first.' }); return; }
    fs.A.sendPasswordResetEmail(fs.auth, form.email.value.trim()).then(() => toast('Reset email sent')).catch(fail);
  };
}
function hideLogin() { $('#loginRoot').innerHTML = ''; }

/* ═════════════ Wiring ═════════════ */
document.addEventListener('click', e => {
  const ad = e.target.closest('#view [data-addto]');
  if (ad) return addToSeries(ad.dataset.addto, ad.dataset.n);
  const es = e.target.closest('#view [data-editseries]');
  if (es) return openSeriesEditor(es.dataset.editseries);
  if (e.target.closest('#view [data-newseries]')) return openSeriesEditor(null);
  const st = e.target.closest('#view [data-stack]');
  if (st) return openSeriesFolder(st.dataset.stack);
  const o = e.target.closest('#view [data-open]');
  if (o) openDetail(o.dataset.open);
});
$$('.tabs button').forEach(b => b.onclick = () => { state.view = b.dataset.view; lsSet('bookshelf.view', state.view); render(); scrollTo({ top: 0 }); });
$('#q').addEventListener('input', e => { state.q = e.target.value; render(); });
[['#fStatus', 'status'], ['#fFormat', 'format'], ['#fGenre', 'genre'], ['#fSort', 'sort']].forEach(([s, k]) =>
  $(s).addEventListener('change', e => { state[k] = e.target.value; lsSet('bookshelf.f' + k[0].toUpperCase() + k.slice(1), state[k]); render(); }));
function clearFilters() { state.q = ''; $('#q').value = ''; ['status', 'format', 'genre'].forEach(k => { state[k] = ''; lsSet('bookshelf.f' + k[0].toUpperCase() + k.slice(1), ''); }); render(); }
$('#fSeries').addEventListener('change', e => { state.seriesMode = e.target.value; lsSet('bookshelf.seriesMode', state.seriesMode); render(); });
$('#addBtn').onclick = () => openAdd();
$('#tbrBtn').onclick = openTBR;
$('#menuBtn').onclick = openMenu;

applyTheme();
renderUnsaved();
render();
let startedJobs = false;
store.start((books, ready, meta) => {
  state.books = books;
  state.meta = meta || null;
  render();
  if (!ready || startedJobs) return;
  startedJobs = true;
  // Anything that couldn't be saved last time: try again now.
  // (Skip any that were changed more recently on another device.)
  Object.values(unsaved).forEach(u => {
    const cur = state.books.find(x => x.id === u.book.id);
    if (cur && (cur.updatedAt || 0) > (u.book.updatedAt || 0)) delete unsaved[u.book.id];
  });
  lsSet('bookshelf.unsaved.v1', unsaved); renderUnsaved();
  const pending = Object.values(unsaved);
  if (pending.length) { pending.forEach(u => store.save({ ...u.book, updatedAt: Date.now() })); toast(`Saving ${pending.length} change${pending.length === 1 ? '' : 's'} from before…`); }
  // First run with this version: start your genre list from the defaults plus every genre already on your books.
  if (!state.meta || !Array.isArray(state.meta.genres)) saveGenreList(allGenres());
  if (incoming) { const items = incoming; incoming = null; handleIncoming(items); }
  setTimeout(fillMissingDetails, 1500);
}).catch(e => {
  toast('Couldn’t connect to Firebase. Check firebase-config.js (' + e.message + ')', 6000);
});

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
